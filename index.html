<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Burger Tycoon: de la esquina al imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d14;--paper:#fbeccb;--red:#d7263d;--gold:#ffd23f;--green:#2e9e44;--blue:#3b82c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'VT323',monospace;font-size:20px;line-height:1.1;color:var(--ink);
 background-color:#2e2140;
 background-image:linear-gradient(45deg,#36284b 25%,transparent 25%,transparent 75%,#36284b 75%),linear-gradient(45deg,#36284b 25%,transparent 25%,transparent 75%,#36284b 75%);
 background-size:32px 32px;background-position:0 0,16px 16px;min-height:100vh;user-select:none;-webkit-user-select:none}
.pf{font-family:'Press Start 2P',monospace}
.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;height:auto}
#app{max-width:1000px;margin:0 auto;padding-bottom:86px}
#hud{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--gold);padding:8px 10px 6px;border-bottom:4px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#h-name{font-family:'Press Start 2P';font-size:10px;color:#fff;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#h-money{font-family:'Press Start 2P';font-size:14px;color:var(--gold)}
#h-money.neg{color:#ff6b6b}
.hstat{font-size:18px;color:#f4e4c1}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#6b5a48}
.daybar{height:6px;background:#4a3a2e;margin-top:5px;border:2px solid #000}
.daybar i{display:block;height:100%;background:var(--gold);width:0}
#banner{margin:8px 10px 0}
.event{background:var(--gold);border:4px solid var(--ink);padding:6px 8px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:blink .5s steps(2) 3}
.event b{font-family:'Press Start 2P';font-size:10px;display:block;margin-bottom:3px}
.event .tbar{height:6px;background:#fff6;border:2px solid var(--ink);margin-top:4px}
.event .tbar i{display:block;height:100%;background:var(--red)}
@keyframes blink{50%{filter:brightness(1.3)}}
.panel{background:var(--paper);border:4px solid var(--ink);margin:10px;padding:10px;box-shadow:0 4px 0 rgba(0,0,0,.35),inset -4px -4px 0 #e2c995,inset 4px 4px 0 #fff8e6;position:relative}
.panel h2{font-family:'Press Start 2P';font-size:11px;background:var(--red);color:#fff;margin:-10px -10px 10px;padding:8px 10px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;gap:6px}
.panel h2 small{font-size:9px;color:var(--gold)}
.panel h3{font-family:'Press Start 2P';font-size:10px;margin:14px 0 8px;color:var(--red)}
.hint{background:#fff;border-style:dashed}
.note{font-size:18px;color:#6b4a2e;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}.grid2 .panel{margin-right:5px}.grid2 .panel+.panel{margin-left:5px;margin-right:10px}}
.queue{display:flex;flex-wrap:wrap;gap:8px;min-height:150px;align-content:flex-start}
.empty{color:#8a6a4a;font-size:20px;padding:30px 0;width:100%;text-align:center}
.cust{width:92px;background:#fff;border:3px solid var(--ink);padding:4px;text-align:center;cursor:pointer;animation:walkin .35s steps(4);box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:manipulation}
.cust.ready{border-color:var(--green);background:#e8ffe9;animation:walkin .35s steps(4),pulse .8s steps(2) infinite}
.cust.shake{animation:shake .3s steps(3)}
@keyframes walkin{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--green),0 0 0 3px var(--green)}}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.cname{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corder{min-height:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin:2px 0}
.pbar,.slot{height:8px;border:2px solid var(--ink);background:#ddd}
.pbar i,.slot i{display:block;height:100%;width:0;background:var(--green)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.station{background:#fff;border:3px solid var(--ink);padding:6px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.station:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.station.off{background:#999;filter:grayscale(1)}
.station.locked{opacity:.45;filter:grayscale(1);cursor:default;box-shadow:none}
.sname{font-family:'Press Start 2P';font-size:8px;margin:4px 0;min-height:16px}
.sstock{font-size:18px}
.slots{display:flex;gap:3px;margin:4px 0}
.slots .slot{flex:1}
.slots .slot i{background:#e8a33d}
.scost{font-size:15px;color:#8a6a4a}
.btn{font-family:'Press Start 2P';font-size:9px;background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 8px;cursor:pointer;text-shadow:1px 1px 0 var(--ink);line-height:1.4;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--green)}.btn.b{background:var(--blue)}.btn.y{background:var(--gold);color:var(--ink);text-shadow:none}
.btn.dis{background:#9a8f85}
.btn.big{font-size:11px;padding:12px 14px;width:100%;margin-top:10px}
.btn.sm{font-size:8px;padding:6px 6px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:8px}
.item .info{flex:1;min-width:0}
.item .t{font-family:'Press Start 2P';font-size:9px;margin-bottom:4px;line-height:1.4}
.item .d{font-size:17px;color:#6b4a2e}
.pips{margin-top:3px}
.pips span{display:inline-block;width:12px;height:8px;border:2px solid var(--ink);margin-right:2px;background:#ddd}
.pips span.on{background:var(--gold)}
.prow{background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:8px}
.prow .top{display:flex;align-items:center;gap:8px}
.prow .nums{font-size:18px;flex:1}
.prow .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.prow .btns .btn{flex:1}
.cheap{color:var(--blue)}.fair{color:var(--green)}.exp{color:var(--red)}
.city{background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:10px}
.city .head{display:flex;gap:10px;align-items:center}
.city .head .nm{font-family:'Press Start 2P';font-size:10px;line-height:1.4}
.city .stats{font-size:18px;margin:6px 0}
.city .ctr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.city.locked{opacity:.55}
.badge{display:inline-block;font-family:'Press Start 2P';font-size:7px;padding:3px 4px;border:2px solid var(--ink);background:var(--gold);margin-left:4px;vertical-align:middle}
.badge.r{background:var(--red);color:#fff}.badge.gr{background:var(--green);color:#fff}
.kv{display:flex;justify-content:space-between;border-bottom:2px dotted #d6bf8f;padding:3px 0}
.log{font-size:17px;max-height:220px;overflow:auto;background:#fff;border:3px solid var(--ink);padding:6px}
.log div{border-bottom:1px dashed #ddd;padding:2px 0}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--ink);border-top:4px solid #000;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#tabs .tb{flex:1;max-width:140px;background:transparent;border:3px solid transparent;color:#f4e4c1;font-family:'Press Start 2P';font-size:7px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
#tabs .tb.on{background:var(--red);border-color:#000;color:#fff}
#tabs .tb img{height:20px!important;width:auto!important}
#toasts{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;width:min(92vw,420px);pointer-events:none}
.toast{background:#fff;border:3px solid var(--ink);padding:6px 8px;margin-bottom:6px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .4s}
.toast.ok{background:#e8ffe9}.toast.warn{background:#ffe8e0}.toast.ev{background:var(--gold)}
.toast.out{opacity:0}
.float{position:absolute;z-index:45;transform:translateX(-50%);font-family:'Press Start 2P';font-size:11px;color:var(--green);text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff;pointer-events:none;animation:rise 1s steps(10) forwards}
.float.bad{color:var(--red)}
@keyframes rise{to{transform:translate(-50%,-50px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,12,30,.8);display:flex;align-items:center;justify-content:center;padding:14px}
#modal.hidden{display:none}
.mbox{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 #000;max-width:440px;width:100%;padding:16px;text-align:center;max-height:92vh;overflow:auto}
.mbox .title{font-family:'Press Start 2P';font-size:22px;color:var(--red);text-shadow:3px 3px 0 var(--ink);line-height:1.4;margin-bottom:6px}
.mbox .sub{font-family:'Press Start 2P';font-size:9px;margin-bottom:12px}
.mbox p{text-align:left}
.mbox input{width:100%;font-family:'VT323';font-size:24px;padding:6px;border:3px solid var(--ink);background:#fff;margin-top:4px}
.mbox label{display:block;text-align:left;font-family:'Press Start 2P';font-size:8px;margin-top:8px}
.goal{font-size:19px;padding:3px 0}
.goal.ok{color:var(--green)}
</style>
</head>
<body>
<div id="app">

</div>
<nav id="tabs"></nav>
<div id="toasts"></div>

<script>

const sprCache = {};
function spr(name, over) {
 const key = name + (over ? JSON.stringify(over) : '');
 if (sprCache[key]) return sprCache[key];
 const rows = SPR[name], h = rows.length, w = rows[0].length;
 const c = document.createElement('canvas'); c.width = w; c.height = h;
 const x = c.getContext('2d');
 for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
  const ch = rows[j][i]; if (ch === '.') continue;
  x.fillStyle = (over && over[ch]) || PAL[ch] || '#f0f'; x.fillRect(i, j, 1, 1);
 }
 return sprCache[key] = c.toDataURL();
}
const img = (name, size, over) => `<img class="spr" src="${spr(name, over)}" style="width:${size}px" alt="">`;

const SHIRTS = ['#e04a3a','#3b82c4','#5cb85c','#9b59b6','#f39c12','#1abc9c','#e84393','#34495e','#75aadb'];

/* ---------- Estado ---------- */
let S = null, tab = 'cocina', paused = false;

 PKEYS.forEach(k => p[k] = {unlocked:k === 'burger', price:PRODUCTS[k].ref, ratio:1, stock:0, cooking:[]});

function deepMerge(a, b) {
 for (const k in b) {
  if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
  else a[k] = b[k];

}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
 try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null; const d = JSON.parse(raw); return deepMerge(newState(d.name), d); }
 catch (e) { return null; }
}

/* ---------- Formato ---------- */
const nf = new Intl.NumberFormat('es-AR', {maximumFractionDigits:0});
function money(n) {
 const a = Math.abs(n), sg = n < 0 ? '-' : '';
 if (a >= 1e9) return sg + '$' + (a / 1e9).toFixed(2).replace('.', ',') + ' mil M';
 if (a >= 1e7) return sg + '$' + (a / 1e6).toFixed(1).replace('.', ',') + ' M';
 return sg + '$' + nf.format(Math.round(a));
}
const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';
function stars(r) { const f = Math.round(r); let s = ''; for (let i = 0; i < 5; i++) s += i < f ? '★' : '<span class="off">★</span>'; return s + ' ' + r.toFixed(1).replace('.', ','); }

/* ---------- Sonido 8 bits ---------- */
let AC = null;
function sfx(type) {
 if (!S || S.muted) return;
 try {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  const f = {tap:[440,660],coin:[988,1319],err:[220,140],buy:[523,784],ev:[330,660],day:[392,523]}[type] || [440,440];
  o.type = 'square'; o.frequency.setValueAtTime(f[0], t); o.frequency.setValueAtTime(f[1], t + 0.07);
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.22);
 } catch (e) {}
}

/* ---------- Mensajes ---------- */
const lastToast = {};
function toast(msg, cls = '', key) {
 if (key) { const n = performance.now(); if (lastToast[key] && n - lastToast[key] < 4000) return; lastToast[key] = n; }
 const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg;
 const box = $('#toasts'); box.append(t);
 while (box.children.length > 3) box.firstChild.remove();
 setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3000);
}
function floatAt(el, txt, bad) {
 if (!el) return;
 const r = el.getBoundingClientRect(), d = document.createElement('div');
 d.className = 'float' + (bad ? ' bad' : ''); d.textContent = txt;
 d.style.left = (r.left + r.width / 2 + window.scrollX) + 'px'; d.style.top = (r.top + window.scrollY) + 'px';
 document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function log(msg) { S.log.unshift('Día ' + S.day + ': ' + msg); S.log = S.log.slice(0, 15); }
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.remove('hidden'); paused = true; }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; paused = false; }

/* ================= LÓGICA ================= */
const mkt = k => PRODUCTS[k].ref * S.I;
const evP = n => S.ev ? EVMAP[S.ev.id][n] : undefined;
const unitCost = k => PRODUCTS[k].ref * S.I * 0.35 * (1 - 0.1 * S.upg.supplier) * (evP('costMul') || 1);
const cookTime = k => PRODUCTS[k].time * Math.pow(0.8, S.upg.speed);
const slots = () => 1 + S.upg.slots;
const qcap = () => 4 + 2 * S.upg.salon;
const blue = () => 1450 * S.I * (1 + S.blue);
const patrimonio = () => S.money + S.usd * blue() * 0.98;
function earn(x) { S.money += x; S.earned += x; S.dayStats.rev += x; }
function spend(x) { S.money -= x; S.dayStats.cost += x; }
function pay(c) {
 if (S.money < c) { sfx('err'); toast('No te alcanza: faltan ' + money(c - S.money), 'warn', 'nomoney'); return false; }
 S.money -= c; sfx('buy'); return true;
}

function spawnInterval() {
 let b = 7 / (1 + 0.3 * S.upg.sign) / (0.55 + S.rep * 0.15);
 if (S.phase >= 2) b /= 1 + 0.1 * S.corp.marca;
 return b / (evP('spawnMul') || 1);
}
function makeOrder() {
 const un = PKEYS.filter(k => S.p[k].unlocked), tw = un.reduce((a, k) => a + PRODUCTS[k].w, 0);
 const n = Math.random() < 0.5 ? 1 : Math.random() < 0.7 ? 2 : 3, o = [];
 for (let i = 0; i < n; i++) { let r = Math.random() * tw; for (const k of un) { r -= PRODUCTS[k].w; if (r <= 0) { o.push(k); break; } } }
 return o.sort((a, b) => PKEYS.indexOf(a) - PKEYS.indexOf(b));
}
function trySpawn() {
 const order = makeOrder();
 if (S.q.length >= qcap()) { S.stats.full++; toast('Salón lleno: un cliente se fue', 'warn', 'full'); return; }
 const price = order.reduce((a, k) => a + S.p[k].price, 0), ref = order.reduce((a, k) => a + mkt(k), 0);
 const accept = clamp(1.9 - price / ref, 0.03, 1);
 if (Math.random() > accept) { S.stats.expensive++; toast(rnd(['«¡Qué caro!»','«Ni loco pago eso»','«Me voy al de enfrente»','«¿Esto sale eso? Chau»']), 'warn', 'exp'); return; }
 const pat = 24 * (1 + 0.25 * S.upg.deco) * (evP('patMul') || 1) * (0.85 + Math.random() * 0.3);
 S.q.push({id:S.nid++, order, pat, max:pat, name:rnd(NAMES), v:[Math.floor(Math.random()*SHIRTS.length), Math.floor(Math.random()*HAIRS.length), Math.floor(Math.random()*SKINS.length)]});
}
function canServe(c) {
 const need = {}; c.order.forEach(k => need[k] = (need[k] || 0) + 1);
 return Object.keys(need).every(k => S.p[k].stock >= need[k]);
}
function serve(id, auto) {
 const i = S.q.findIndex(c => c.id === id); if (i < 0) return false;
 const c = S.q[i], el = document.getElementById('c' + id);
 if (!canServe(c)) { if (!auto) { sfx('err'); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } toast('Todavía no está listo el pedido', 'warn', 'notready'); } return false; }
 c.order.forEach(k => S.p[k].stock--);
 const rev = c.order.reduce((a, k) => a + S.p[k].price, 0), frac = c.pat / c.max, tip = Math.round(rev * 0.15 * frac);
 const r = rev / c.order.reduce((a, k) => a + mkt(k), 0);
 earn(rev + tip);
 S.rep = clamp(S.rep + 0.035 * (frac - 0.25) - (r > 1.3 ? 0.03 : 0), 0, 5);
 S.q.splice(i, 1); S.stats.served++;
 floatAt(el, '+' + money(rev + tip)); sfx('coin');
 return true;
}
function cook(k, auto) {
 const p = S.p[k]; if (!p.unlocked) return false;
 const fail = m => { if (!auto) { sfx('err'); if (m) toast(m, 'warn', m); } return false; };
 if (evP('noCook')) return fail('Sin luz no se cocina');
 if (p.cooking.length >= slots()) return fail('');
 if (p.stock + p.cooking.length >= STOCK_MAX) return fail('El mostrador está lleno');
 const c = unitCost(k); if (S.money < c) return fail('No te alcanza para los insumos');
 spend(c); const t = cookTime(k); p.cooking.push({t, total:t}); if (!auto) sfx('tap');
 return true;
}
function aiCook() {
 const need = {}; S.q.forEach(c => c.order.forEach(k => need[k] = (need[k] || 0) + 1));
 let best = null, bs = 0;
 for (const k of PKEYS) {
  const p = S.p[k]; if (!p.unlocked || p.cooking.length >= slots()) continue;
  const have = p.stock + p.cooking.length, sc = (need[k] || 0) - have + (have < 1 ? 0.5 : 0);
  if (sc > bs) { bs = sc; best = k; }
 }
 if (best) cook(best, true);
}
function aiServe() {
 const c = S.q.filter(canServe).sort((a, b) => a.pat - b.pat)[0];
 if (c) serve(c.id, true);
}
function startEvent() {
 const pool = EVENTS.filter(e => !(e.id === 'bromato' && S.day < 3) && !(e.id === 'deval' && S.day < 4));
 let r = Math.random() * pool.reduce((a, e) => a + e.w, 0), e = pool[0];
 for (const x of pool) { r -= x.w; if (r <= 0) { e = x; break; } }
 S.ev = {id:e.id, t:e.dur, dur:e.dur, msg:e.desc};
 if (e.id === 'deval') {
  S.I *= 1.1; S.inf = Math.min(0.3, S.inf + 0.06); S.blue += 0.12;
  S.ev.msg = 'Los precios de mercado saltaron 10% y la inflación se acelera. ¡Remarcá!';
 }
 if (e.id === 'bromato') {
  if (S.rep >= 3.5 || S.upg.deco >= 1) { S.rep = Math.min(5, S.rep + 0.2); S.ev.msg = 'Aprobaste con felicitaciones: +reputación'; }
  else { const f = Math.round(Math.max(0, S.money) * 0.08 + 20000 * S.I); S.money -= f; S.ev.msg = 'Multa de ' + money(f) + '. Subí la reputación o mejorá la decoración.'; }
 }
 log(e.title + (S.ev.msg ? ': ' + S.ev.msg : ''));
 sfx('ev'); S.evT = 55 + Math.random() * 75;
}

function endDay() {
 const I = S.I; let wages = 0;
 for (const k in STAFF) wages += STAFF[k].wage * S.staff[k] * I;
 const rent = 20000 * I * (1 + 0.5 * S.upg.salon);
 spend(wages + rent);
 if (S.money < 0) { const int = -S.money * 0.02; spend(int); toast('Estás en rojo: el banco te cobra ' + money(int) + ' de interés', 'warn'); }
 if (S.staff.contador) PKEYS.forEach(k => { const p = S.p[k]; p.price = roundP(p.ratio * mkt(k)); });
 S.inf = clamp(S.inf + (0.05 - S.inf) * 0.04 + (Math.random() - 0.5) * 0.012, 0.01, 0.35);
 if (S.phase >= 2) chainDay();
 const net = S.dayStats.rev - S.dayStats.cost;
 toast('Cierre del día ' + S.day + ': ' + (net >= 0 ? '+' : '') + money(net), net >= 0 ? 'ok' : 'warn');
 sfx('day'); S.day++; S.dayStats = {rev:0, cost:0}; save();
}

/* ---------- Cadena ---------- */
function bCalc(id) {
 const c = CITY[id], b = S.br[id], I = S.I, pol = POLMUL[b.policy];
 const eff = pol * S.list / I / c.wealth;
 const df = clamp(1 - (eff - 1) * 1.4, 0.1, 1.7);
 const q = Math.min(1.2, 0.35 + 0.15 * b.staff + 0.15 * b.mgr + 0.05 * S.corp.compras + 0.05 * S.corp.escuela);
 const boost = b.boostT > 0 ? b.boostMul : 1;
 const demand = c.market * df * (1 + 0.2 * S.corp.marca) * (0.5 + 0.5 * q) * (1 + 0.15 * b.mkt) * boost * (0.6 + 0.6 * b.rep);
 const cap = 40 * b.staff * [0.8, 1.1, 1.35][b.mgr];
 const closed = b.closedT > 0, sales = closed ? 0 : Math.min(demand, cap);
 const ticket = 11000 * S.list * pol, rev = sales * ticket;
 const food = sales * 11000 * I * 0.4 * (1 - 0.08 * S.corp.compras);
 const wages = (b.staff * 70000 + [0, 60000, 160000][b.mgr] * (S.corp.escuela ? 0.7 : 1)) * I;
 const cost = food + wages + c.rent * I + b.mkt * 50000 * I;
 const sat = clamp(0.25 + 0.5 * q - (demand > cap ? 0.3 * (1 - cap / demand) : 0) - Math.max(0, eff - 1) * 0.5 + Math.max(0, 1 - eff) * 0.3, 0, 1);
 return {demand, cap, sales, rev, cost, profit:rev - cost, sat, q, closed, eff};
}
function chainProfit() { let t = 0; for (const id in S.br) t += bCalc(id).profit; return t; }
function chainTick(dt) {
 const f = dt / DAY_SEC;
 for (const id in S.br) { const r = bCalc(id); earn(r.rev * f); spend(r.cost * f); }
}
const BEV = [
 {t:'reseña viral en TikTok: +60% de demanda por 3 días', good:true, fn:b => { b.boostT = 3; b.boostMul = 1.6; }},
 {t:'hay un recital en la ciudad: +50% de demanda hoy', good:true, fn:b => { b.boostT = 1; b.boostMul = 1.5; }},
 {t:'renunció el encargado', cond:b => b.mgr === 1, fn:b => { b.mgr = 0; }},
 {t:'clausura de bromatología por 2 días', cond:(b, r) => r.q < 0.75, fn:b => { b.closedT = 2; }},
 {t:'paro gastronómico: cerrado 1 día', cond:b => b.mgr < 2, fn:b => { b.closedT = Math.max(b.closedT, 1); }},
 {t:'se rompió la freidora', fn:() => { S.money -= 300000 * S.I; }}
];
function chainDay() {
 if (S.corp.contador) S.list = S.I;
 for (const id in S.br) {
  const b = S.br[id], r = bCalc(id);
  b.rep = clamp(b.rep + (r.sat - b.rep) * 0.2, 0, 1);
  if (b.boostT > 0) b.boostT--; if (b.closedT > 0) b.closedT--;
  if (Math.random() < 0.07 * (b.mgr === 0 ? 1.6 : 1)) {
   const pool = BEV.filter(e => !e.cond || e.cond(b, r)), e = rnd(pool);
   e.fn(b); const msg = CITY[id].name + ': ' + e.t; log(msg); toast(msg, e.good ? 'ok' : 'warn');
  }
 }
}
function goals() {
 return [
  ['Menú completo (5 productos)', PKEYS.every(k => S.p[k].unlocked)],
  ['Parrillero y cajero contratados', S.staff.parrillero > 0 && S.staff.cajero > 0],
  ['Reputación de 4★ o más', S.rep >= 4],
  ['Patrimonio de ' + money(3e6 * S.I) + ' (plata + dólares)', patrimonio() >= 3e6 * S.I]
 ];
}

/* ---------- Bucle ---------- */
function tick(dt) {
 S.t += dt;
 S.I *= Math.pow(1 + S.inf, dt / (DAY_SEC * 30));
 S.blue = clamp(S.blue + (Math.random() - 0.5) * 0.03 * dt + (0.03 - S.blue) * 0.01 * dt, -0.08, 0.5);
 if (S.ev) { S.ev.t -= dt; if (S.ev.t <= 0) S.ev = null; }
 else { S.evT -= dt; if (S.evT <= 0) startEvent(); }
 if (!evP('noCook')) for (const k of PKEYS) {
  const p = S.p[k];
  p.cooking.forEach(c => c.t -= dt);
  while (p.cooking.length && p.cooking[0].t <= 0) { p.cooking.shift(); p.stock++; }
 }
 S.spawnT -= dt;
 if (S.spawnT <= 0) { trySpawn(); S.spawnT = spawnInterval() * (0.6 + Math.random() * 0.8); }
 for (let i = S.q.length - 1; i >= 0; i--) {
  const c = S.q[i]; c.pat -= dt;
  if (c.pat <= 0) {
   floatAt(document.getElementById('c' + c.id), '¡Me voy!', true);
   S.q.splice(i, 1); S.stats.lost++; S.rep = clamp(S.rep - 0.1, 0, 5); sfx('err');
  }
 }
 if (S.staff.parrillero) { S.ai.p -= dt; if (S.ai.p <= 0) { aiCook(); S.ai.p = [0, 1.8, 1.1, 0.6][S.staff.parrillero]; } }
 if (S.staff.cajero) { S.ai.c -= dt; if (S.ai.c <= 0) { aiServe(); S.ai.c = [0, 2.2, 1.3, 0.7][S.staff.cajero]; } }
 if (S.phase >= 2) chainTick(dt);
 S.dayT += dt; if (S.dayT >= DAY_SEC) { S.dayT -= DAY_SEC; endDay(); }
}

/* ================= ACCIONES ================= */
function adjPrice(k, f) { const p = S.p[k]; p.price = roundP(p.price * f); p.ratio = p.price / mkt(k); }
function buy(arg) {
 const [kind, k] = arg.split(':');
 if (kind === 'menu') {
  const p = S.p[k]; if (p.unlocked) return;
  if (pay(PRODUCTS[k].unlock * S.I)) { p.unlocked = true; p.price = roundP(mkt(k)); p.ratio = 1; toast('Nuevo en el menú: ' + PRODUCTS[k].name, 'ok'); }
 } else if (kind === 'upg') {
  const lv = S.upg[k], cs = UPG[k].costs; if (lv >= cs.length) return;
  if (pay(cs[lv] * S.I)) S.upg[k]++;
 } else if (kind === 'staff') {
  const lv = S.staff[k], cs = STAFF[k].costs; if (lv >= cs.length) return;
  if (pay(cs[lv] * S.I)) { S.staff[k]++; toast(lv ? STAFF[k].name + ' capacitado' : 'Contrataste un ' + STAFF[k].name.toLowerCase(), 'ok'); }
 } else if (kind === 'corp') {
  const lv = S.corp[k], cs = CORP[k].costs; if (lv >= cs.length) return;
  if (pay(cs[lv] * S.I)) { S.corp[k]++; if (k === 'contador') S.list = S.I; }
 }
}
function foundChain() {
 if (!goals().every(g => g[1])) return;
 S.phase = 2; S.list = S.I; tab = 'cadena'; log('Fundaste la cadena ' + S.name);
 modal(`<div class="title" style="font-size:16px">¡NACE UNA<br>CADENA!</div>${img('store', 96)}
 <p>Un inversor probó tu lomito y quedó enamorado. Te propone armar una sociedad: vos ponés la marca y la receta, él los contactos.</p>
 <p>Desde ahora abrís sucursales en todo el país. Cada una funciona sola, pero vos decidís su <b>política de precios</b>, cuánto <b>personal</b> tiene, si lleva <b>encargado</b> y cuánto invierte en <b>marketing</b>.</p>
 <p>Ojo con la <b>lista de precios</b> de la cadena: si no la actualizás, la inflación te come el margen en todas las sucursales a la vez. Tu local original lo seguís atendiendo vos.</p>
 <button class="btn big g" data-act="close">¡Vamos!</button>`);
}
function branchAct(a, id) {
 const b = S.br[id], I = S.I;
 if (a === 'open') {
  const c = CITY[id]; if (b || S.corp.logistica < c.log) return;
  if (pay(c.cost * I)) { S.br[id] = {staff:1, mgr:0, policy:1, mkt:0, closedT:0, boostT:0, boostMul:1, rep:0.6}; log('Abriste en ' + c.name); toast('¡Inauguraste la sucursal ' + c.name + '!', 'ok'); }
 } else if (!b) return;
 else if (a === 'bstaff') { if (b.staff < 4 && pay(1.2e6 * b.staff * I)) b.staff++; }
 else if (a === 'bmgr') { if (b.mgr === 0 && pay(1e6 * I)) b.mgr = 1; }
 else if (a === 'bmgr2') { if (b.mgr < 2 && S.corp.escuela && pay(4e6 * I)) b.mgr = 2; }
 else if (a === 'bpol') { b.policy = (b.policy + 1) % 3; sfx('tap'); }
 else if (a === 'bmkt') { if (b.mkt < 3 && pay(0.8e6 * (b.mkt + 1) * I)) b.mkt++; }
}
function ending() {
 S.won = true; log('¡Salida a la bolsa!');
 modal(`<div class="title" style="font-size:16px">¡TIMBREASTE<br>EN LA BOLSA!</div>${img('tower', 64)}
 <p><b>${esc(S.name)}</b> cotiza en la Bolsa de Comercio de Buenos Aires. Empezaste con una plancha y una esquina, y hoy tenés una cadena nacional.</p>
 <div class="kv"><span>Días</span><b>${S.day}</b></div>
 <div class="kv"><span>Clientes atendidos por vos</span><b>${nf.format(S.stats.served)}</b></div>
 <div class="kv"><span>Sucursales</span><b>${Object.keys(S.br).length}</b></div>
 <div class="kv"><span>Inflación acumulada</span><b>${nf.format((S.I - 1) * 100)}%</b></div>
 <button class="btn big g" data-act="close">Seguir jugando</button>`);
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function act(a, arg) {
 switch (a) {
  case 'cook': cook(arg, false); break;
  case 'serve': serve(+arg, false); break;
  case 'tab': tab = arg; sfx('tap'); window.scrollTo(0, 0); break;
  case 'price': { const [k, f] = arg.split(':'); adjPrice(k, +f); sfx('tap'); break; }
  case 'remarcar': PKEYS.forEach(k => { const p = S.p[k]; if (p.unlocked) p.price = roundP(p.ratio * mkt(k)); }); sfx('buy'); toast('Remarcaste toda la carta', 'ok'); break;
  case 'igualar': PKEYS.forEach(k => { const p = S.p[k]; if (p.unlocked) { p.price = roundP(mkt(k)); p.ratio = 1; } }); sfx('buy'); break;
  case 'buy': buy(arg); break;
  case 'found': foundChain(); break;
  case 'open': case 'bstaff': case 'bmgr': case 'bmgr2': case 'bpol': case 'bmkt': branchAct(a, arg); break;
  case 'list': S.list = S.I; sfx('buy'); toast('Lista de precios actualizada en toda la cadena', 'ok'); break;
  case 'ipo': if (Object.keys(S.br).length >= 8 && S.corp.marca >= 3 && pay(IPO_COST * S.I)) ending(); break;
  case 'usdbuy': {
   const rate = blue() * 1.02, max = Math.floor(Math.max(0, S.money) / rate), n = arg === 'all' ? max : Math.min(+arg, max);
   if (n <= 0) { sfx('err'); toast('No te alcanza para comprar dólares', 'warn'); break; }
   S.money -= n * rate; S.usd += n; sfx('buy'); toast('Compraste US$ ' + nf.format(n) + ' a ' + money(rate), 'ok'); break;
  }
  case 'usdsell': {
   const n = arg === 'all' ? S.usd : Math.min(+arg, S.usd);
   if (n <= 0) { sfx('err'); break; }
   const rate = blue() * 0.98; S.usd -= n; S.money += n * rate; sfx('coin'); toast('Vendiste US$ ' + nf.format(n) + ' a ' + money(rate), 'ok'); break;
  }
  case 'mute': S.muted = !S.muted; break;
  case 'reset': modal(`<div class="sub">¿Borrar la partida y empezar de cero?</div><button class="btn big" data-act="doreset">Sí, borrar todo</button><button class="btn big b" data-act="close">Cancelar</button>`); break;
  case 'doreset': try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = newState(); tab = 'cocina'; intro(); break;
  case 'start': { const n = ($('#nm').value || '').trim().slice(0, 22) || 'La Esquina'; S = newState(n); closeModal(); save(); break; }
  case 'close': closeModal(); break;
 }
 render();
}
document.addEventListener('pointerdown', e => {
 const t = e.target.closest('[data-fast]'); if (!t || paused) return;
 e.preventDefault(); act(t.dataset.fast, t.dataset.arg);
});
document.addEventListener('click', e => {
 const t = e.target.closest('[data-act]'); if (!t) return;
 act(t.dataset.act, t.dataset.arg);
});
document.addEventListener('keydown', e => {
 if (paused || !S || e.target.tagName === 'INPUT') return;
 const n = parseInt(e.key, 10);
 if (n >= 1 && n <= 5) { cook(PKEYS[n - 1], false); render(); }
 if (e.code === 'Space') { e.preventDefault(); const c = S.q.filter(canServe).sort((a, b) => a.pat - b.pat)[0]; if (c) serve(c.id, false); else sfx('err'); render(); }
});

/* ================= RENDER ================= */
function setKey(el, key, fn) { if (el && el._k !== key) { el._k = key; el.innerHTML = fn(); } }
const pips = (lv, max) => `<div class="pips">${Array.from({length:max}, (_, i) => `<span class="${i < lv ? 'on' : ''}"></span>`).join('')}</div>`;
const costBtn = (act, arg, cost, label, cls = '') => `<button class="btn ${cls}" data-act="${act}" data-arg="${arg}" data-cost="${cost}">${label || money(cost)}</button>`;
const ratioCls = r => r < 0.92 ? 'cheap' : r <= 1.15 ? 'fair' : 'exp';
const ratioTxt = r => r < 0.92 ? 'barato' : r <= 1.15 ? 'justo' : 'caro';

function renderHUD() {
 $('#h-name').textContent = S.name;
 const m = $('#h-money'); m.textContent = money(S.money); m.classList.toggle('neg', S.money < 0);
 $('#h-rep').innerHTML = stars(S.rep);
 $('#h-day').textContent = 'Día ' + S.day;
 $('#h-inf').textContent = 'IPC ' + pct(S.inf) + '/mes';
 $('#h-extra').textContent = S.phase >= 2 ? 'Cadena ' + money(chainProfit()) + '/día' : 'Blue ' + money(blue());
 $('#h-dayb').style.width = (S.dayT / DAY_SEC * 100) + '%';
}
function renderBanner() {
 const b = $('#banner');
 if (!S.ev) { setKey(b, 'none', () => ''); return; }
 const e = EVMAP[S.ev.id];
 setKey(b, 'ev' + S.ev.id + S.ev.msg, () => `<div class="event"><b>${e.title}</b>${esc(S.ev.msg || '')}<div class="tbar"><i id="evbar"></i></div></div>`);
 const bar = $('#evbar'); if (bar) bar.style.width = (S.ev.t / S.ev.dur * 100) + '%';
}
function renderTabs() {
 const tabs = [['cocina','burger','Cocina'],['precios','coin','Precios'],['mejoras','arrow','Mejoras']];
 if (S.phase >= 2) tabs.push(['cadena','store','Cadena'], ['empresa','tower','Empresa']);
 tabs.push(['banco','bill','Banco']);
 setKey($('#tabs'), tab + S.phase, () => tabs.map(([id, s, l]) => `<button class="tb ${tab === id ? 'on' : ''}" data-act="tab" data-arg="${id}">${img(s, 22)}${l}</button>`).join(''));
}
function custHTML(c) {
 return `<div class="cust" id="c${c.id}" data-fast="serve" data-arg="${c.id}">
  ${img('person', 40, {T:SHIRTS[c.v[0]], h:HAIRS[c.v[1]], f:SKINS[c.v[2]]})}
  <div class="cname">${c.name}</div>
  <div class="corder">${c.order.map(k => img(PRODUCTS[k].spr, 22)).join('')}</div>
  <div class="pbar"><i></i></div></div>`;
}
function stationHTML(k, i) {
 const p = S.p[k], P = PRODUCTS[k];
 if (!p.unlocked) return `<div class="station locked">${img(P.spr, 44)}<div class="sname">${P.name}</div><div class="scost">Desbloqueá en Mejoras</div></div>`;
 return `<div class="station" id="st-${k}" data-fast="cook" data-arg="${k}">${img(P.spr, 44)}
  <div class="sname">${P.name}</div>
  <div class="sstock">Listos: <b id="ss-${k}">0</b>/${STOCK_MAX}</div>
  <div class="slots" id="sl-${k}">${'<div class="slot"><i></i></div>'.repeat(slots())}</div>
  <div class="scost" id="sc-${k}"></div><div class="scost">[${i + 1}]</div></div>`;
}
function vCocina(v) {
 setKey(v, 'cocina', () => `<div id="tut"></div><div class="grid2">
  <section class="panel"><h2>Salón <small id="qinfo"></small></h2><div id="queue" class="queue"></div></section>
  <section class="panel"><h2>Cocina <small id="kinfo"></small></h2><div id="stations" class="stations"></div><div id="staffline" class="note"></div></section>
  </div><div id="goals"></div>`);
 setKey($('#tut'), 't' + (S.stats.served < 3 ? 1 : 0), () => S.stats.served < 3 ? `<section class="panel hint">
  <b>Cómo se juega:</b> tocá una estación de la cocina para preparar comida (gastás en insumos). Cuando un cliente se ilumina en verde, tocalo para cobrarle. Si espera demasiado, se va enojado y baja tu reputación. En PC: teclas 1 a 5 para cocinar y espacio para entregar.</section>` : '');
 $('#qinfo').textContent = S.q.length + '/' + qcap();
 $('#kinfo').textContent = 'Insumos ×' + (S.I).toFixed(2).replace('.', ',');
 setKey($('#queue'), S.q.map(c => c.id).join(',') || 'empty', () => S.q.length ? S.q.map(custHTML).join('') : `<div class="empty">Esperando clientes…</div>`);
 S.q.forEach(c => {
  const el = document.getElementById('c' + c.id); if (!el) return;

  el.classList.toggle('ready', canServe(c));
 });
 setKey($('#stations'), PKEYS.map(k => S.p[k].unlocked ? 1 : 0).join('') + ':' + slots(), () => PKEYS.map(stationHTML).join(''));
 const off = !!evP('noCook');
 PKEYS.forEach(k => {
  const p = S.p[k]; if (!p.unlocked) return;
  $('#ss-' + k).textContent = p.stock;
  document.querySelectorAll('#sl-' + k + ' i').forEach((i, n) => { const c = p.cooking[n]; i.style.width = c ? ((1 - c.t / c.total) * 100) + '%' : '0%'; });
  $('#sc-' + k).textContent = 'Insumos ' + money(unitCost(k));
  $('#st-' + k).classList.toggle('off', off);
 });
 const st = Object.keys(STAFF).filter(k => S.staff[k]).map(k => STAFF[k].name + ' nv' + S.staff[k]);
 $('#staffline').textContent = st.length ? 'Equipo: ' + st.join(' · ') : 'Por ahora estás solo en el local. Contratá gente en Mejoras.';
 const gs = goals();
 setKey($('#goals'), S.phase + gs.map(g => g[1] ? 1 : 0).join('') + Math.round(S.I * 50), () => S.phase >= 2 ? '' : `<section class="panel"><h2>Camino a la franquicia</h2>
  ${gs.map(g => `<div class="goal ${g[1] ? 'ok' : ''}">${g[1] ? '■' : '□'} ${g[0]}</div>`).join('')}
  ${gs.every(g => g[1]) ? '<button class="btn big g" data-act="found">Fundar la cadena</button>' : '<div class="note">Cuando cumplas todo, el local se te queda chico y podés pasar a manejar una cadena de sucursales.</div>'}</section>`);

 setKey(v, 'precios' + un.join() + S.staff.contador, () => `<section class="panel"><h2>Lista de precios</h2>
  <div class="note" style="margin-top:0">La inflación sube el precio de mercado todos los días. Si no remarcás, vendés barato y perdés margen; si te pasás, los clientes se van al de enfrente y baja tu reputación.</div>
  <div style="display:flex;gap:6px;margin:10px 0"><button class="btn g" style="flex:1" data-act="remarcar">Remarcar por inflación</button><button class="btn b" style="flex:1" data-act="igualar">Igualar al mercado</button></div>
  ${S.staff.contador ? '<div class="note">Tu contador remarca todo al cierre de cada día, respetando tu margen.</div>' : ''}
  ${un.map(k => `<div class="prow"><div class="top">${img(PRODUCTS[k].spr, 36)}<div class="nums"><b class="pf" style="font-size:9px">${PRODUCTS[k].name}</b><br>
   Tu precio <b id="pp-${k}"></b> · Mercado <span id="pm-${k}"></span><br><span id="pr-${k}"></span> · Costo <span id="pc-${k}"></span> · Margen <span id="pg-${k}"></span></div></div>
   <div class="btns"><button class="btn sm b" data-act="price" data-arg="${k}:0.9">-10%</button><button class="btn sm b" data-act="price" data-arg="${k}:0.95">-5%</button><button class="btn sm" data-act="price" data-arg="${k}:1.05">+5%</button><button class="btn sm" data-act="price" data-arg="${k}:1.1">+10%</button></div></div>`).join('')}
  </section>`);
 un.forEach(k => {
  const p = S.p[k], r = p.price / mkt(k), c = unitCost(k);

  const pr = $('#pr-' + k); pr.className = ratioCls(r); pr.textContent = Math.round(r * 100) + '% (' + ratioTxt(r) + ')';

 });

function itemHTML(icon, name, desc, lv, max, act, arg, cost) {
 return `<div class="item">${icon}<div class="info"><div class="t">${name}</div><div class="d">${desc}</div>${max > 1 ? pips(lv, max) : ''}</div>
  ${lv >= max ? '<span class="badge gr">LISTO</span>' : costBtn(act, arg, cost)}</div>`;
}
function vMejoras(v) {
 const key = 'mej' + JSON.stringify([S.upg, S.staff, PKEYS.map(k => S.p[k].unlocked)]) + Math.round(S.I * 50);
 setKey(v, key, () => `<section class="panel"><h2>Menú</h2>
  ${PKEYS.filter(k => k !== 'burger').map(k => itemHTML(img(PRODUCTS[k].spr, 32), PRODUCTS[k].name, 'Precio de mercado ' + money(mkt(k)), S.p[k].unlocked ? 1 : 0, 1, 'buy', 'menu:' + k, PRODUCTS[k].unlock * S.I)).join('')}
  </section><section class="panel"><h2>Equipamiento</h2>
  ${Object.keys(UPG).map(k => itemHTML(img('arrow', 24), UPG[k].name, UPG[k].desc, S.upg[k], UPG[k].costs.length, 'buy', 'upg:' + k, (UPG[k].costs[S.upg[k]] || 0) * S.I)).join('')}
  </section><section class="panel"><h2>Personal</h2>
  ${Object.keys(STAFF).map(k => itemHTML(img('chef', 24), STAFF[k].name + (S.staff[k] ? ' nv' + S.staff[k] : ''), STAFF[k].desc + '. Sueldo ' + money(STAFF[k].wage * S.I) + '/día por nivel', S.staff[k], STAFF[k].costs.length, 'buy', 'staff:' + k, (STAFF[k].costs[S.staff[k]] || 0) * S.I)).join('')}
  <div class="note">Sueldos y alquiler se pagan al cierre de cada día y suben con la inflación.</div></section>`);
}
function branchHTML(id) {
 const c = CITY[id], b = S.br[id], I = S.I;
 if (!b) {
  const locked = S.corp.logistica < c.log;
  const wl = c.wealth >= 1.3 ? 'muy alto' : c.wealth >= 1.05 ? 'alto' : c.wealth >= 1 ? 'medio' : 'bajo';
  return `<div class="city ${locked ? 'locked' : ''}"><div class="head">${img('store', 56, {R:'#888', c:'#555'})}<div><div class="nm">${c.name}</div><div class="d">${c.prov} · se alquila</div></div></div>
   <div class="stats">Mercado: ${c.market} clientes/día · Poder adquisitivo ${wl} · Alquiler ${money(c.rent * I)}/día</div>
   ${locked ? `<span class="badge r">Requiere Logística nv${c.log}</span>` : costBtn('open', id, c.cost * I, 'Abrir sucursal · ' + money(c.cost * I), 'g')}</div>`;
 }
 const mg = ['Sin encargado', 'Encargado', 'Encargado estrella'][b.mgr];
 return `<div class="city"><div class="head">${img('store', 56)}<div style="flex:1"><div class="nm">${c.name} <span id="bb-${id}"></span></div><div class="d">${c.prov} · ${mg}</div></div></div>
  <div class="stats" id="bs-${id}"></div>
  <div class="ctr">
   <button class="btn b sm" data-act="bpol" data-arg="${id}">Precios: ${POLICY[b.policy]}</button>
   ${b.staff < 4 ? costBtn('bstaff', id, 1.2e6 * b.staff * I, 'Personal nv' + (b.staff + 1) + ' · ' + money(1.2e6 * b.staff * I), 'sm') : '<span class="badge gr">Personal al máximo</span>'}
   ${b.mgr === 0 ? costBtn('bmgr', id, 1e6 * I, 'Encargado · ' + money(1e6 * I), 'sm') : b.mgr === 1 ? (S.corp.escuela ? costBtn('bmgr2', id, 4e6 * I, 'Estrella · ' + money(4e6 * I), 'sm y') : '<span class="badge">Estrella: requiere Escuela</span>') : '<span class="badge gr">Encargado estrella</span>'}
   ${b.mkt < 3 ? costBtn('bmkt', id, 0.8e6 * (b.mkt + 1) * I, 'Marketing nv' + (b.mkt + 1) + ' · ' + money(0.8e6 * (b.mkt + 1) * I), 'sm') : '<span class="badge gr">Marketing al máximo</span>'}
  </div></div>`;
}
function vCadena(v) {
 const key = 'cad' + JSON.stringify([S.br, S.corp]) + Math.round(S.I * 50);
 setKey(v, key, () => `<section class="panel"><h2>Tu cadena <small id="cinfo"></small></h2>
  <div class="kv"><span>Ganancia de la cadena</span><b id="cprof"></b></div>
  <div class="kv"><span>Lista de precios vs. inflación</span><b id="clist"></b></div>
  ${S.corp.contador ? '<div class="note">El estudio contable actualiza la lista todos los días.</div>' : '<button class="btn big" data-act="list">Actualizar lista de precios</button><div class="note">Si la lista queda atrasada, vendés más pero con menos margen. Actualizarla seguido es la clave.</div>'}
  </section><section class="panel"><h2>Sucursales</h2>
  <div class="city"><div class="head">${img('store', 56)}<div><div class="nm">${esc(S.name)} <span class="badge">Casa central</span></div><div class="d">Tucumán · la atendés vos</div></div></div></div>
  ${CITIES.map(c => branchHTML(c.id)).join('')}</section>`);
 const n = Object.keys(S.br).length;
 $('#cinfo').textContent = n + '/' + CITIES.length;
 const cp = chainProfit(), cpe = $('#cprof'); cpe.textContent = money(cp) + '/día'; cpe.className = cp >= 0 ? 'fair' : 'exp';
 const lag = S.list / S.I - 1, cl = $('#clist'); cl.textContent = (lag >= 0 ? '+' : '') + pct(lag); cl.className = lag < -0.08 ? 'exp' : lag < -0.03 ? 'cheap' : 'fair';
 for (const id in S.br) {

 }
}
function vEmpresa(v) {
 const n = Object.keys(S.br).length, ipoOk = n >= 8 && S.corp.marca >= 3;
 const key = 'emp' + JSON.stringify(S.corp) + n + S.won + Math.round(S.I * 50);
 setKey(v, key, () => `<section class="panel"><h2>Oficina corporativa</h2>
  ${Object.keys(CORP).map(k => itemHTML(img('tower', 22), CORP[k].name, CORP[k].desc, S.corp[k], CORP[k].costs.length, 'buy', 'corp:' + k, (CORP[k].costs[S.corp[k]] || 0) * S.I)).join('')}
  </section><section class="panel"><h2>Salir a la bolsa</h2>
  <div class="goal ${n >= 8 ? 'ok' : ''}">${n >= 8 ? '■' : '□'} 8 sucursales o más (${n})</div>

 setKey(v, 'banco' + S.log.length + (S.log[0] || '') + S.muted, () => `<section class="panel"><h2>Dólar blue</h2>

function updateAfford() { document.querySelectorAll('#view [data-cost]').forEach(b => b.classList.toggle('dis', S.money < +b.dataset.cost)); }
function render() {
 if (!S) return;
 renderHUD(); renderBanner(); renderTabs();

 ({cocina:vCocina, precios:vPrecios, mejoras:vMejoras, cadena:vCadena, empresa:vEmpresa, banco:vBanco})[tab](v);

/* ================= INICIO ================= */
function intro() {
 modal(`<div class="title">BURGER<br>TYCOON</div><div class="sub">De la esquina al imperio</div>${img('burger', 96)}
 <p>Te quedaste con un localcito en una esquina de Tucumán: una plancha, un mostrador y muchas ganas. Cociná, atendé, remarcá antes de que la inflación te coma el margen y, si te va bien, armá una cadena en todo el país.</p>
 <label>Nombre de tu hamburguesería</label><input id="nm" maxlength="22" value="La Esquina">
 <button class="btn big g" data-act="start">Abrir el local</button>`);
}
S = load();
if (!S) { S = newState(); intro(); }
let last = performance.now(), saveT = 0;
setInterval(() => {
 const now = performance.now(), dt = Math.min((now - last) / 1000, 1); last = now;
 if (!S || paused) return;
 tick(dt); render();
 saveT += dt; if (saveT > 10) { saveT = 0; save(); }
}, 100);
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
render();
</script>
