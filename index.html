<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Burger Tycoon Tucumán: de la esquina al imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
:root{--ink:#2b1d14;--paper:#fbeccb;--red:#d7263d;--gold:#ffd23f;--green:#2e9e44;--blue:#3b82c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'VT323',monospace;font-size:20px;line-height:1.1;color:var(--ink);
 background-color:#2e2140;
 background-image:linear-gradient(45deg,#36284b 25%,transparent 25%,transparent 75%,#36284b 75%),linear-gradient(45deg,#36284b 25%,transparent 25%,transparent 75%,#36284b 75%);
 background-size:32px 32px;background-position:0 0,16px 16px;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pf{font-family:'Press Start 2P',monospace}
.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;height:auto}
#app{max-width:1000px;margin:0 auto;padding-bottom:90px}
#hud{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--gold);padding:8px 10px 6px;border-bottom:4px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#h-name{font-family:'Press Start 2P';font-size:9px;color:#fff;max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#h-money{font-family:'Press Start 2P';font-size:13px;color:var(--gold);margin-left:auto}
#h-money.neg{color:#ff6b6b}
.hbtn{font-family:'Press Start 2P';font-size:9px;background:#4a3a2e;color:#fff;border:2px solid #000;box-shadow:0 3px 0 #000;padding:6px 7px;cursor:pointer}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.hbtn.on{background:var(--red)}
.hstat{font-size:18px;color:#f4e4c1}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#6b5a48}
.daybar{height:6px;background:#4a3a2e;margin-top:5px;border:2px solid #000}
.daybar i{display:block;height:100%;background:var(--gold);width:0}
#banner{margin:8px 10px 0}
.event{background:var(--gold);border:4px solid var(--ink);padding:6px 8px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:blink .5s steps(2) 3}
.event b{font-family:'Press Start 2P';font-size:10px;display:block;margin-bottom:3px;line-height:1.4}
.event .tbar{height:6px;background:#fff6;border:2px solid var(--ink);margin-top:4px}
.event .tbar i{display:block;height:100%;background:var(--red)}
@keyframes blink{50%{filter:brightness(1.3)}}
.panel{background:var(--paper);border:4px solid var(--ink);margin:10px;padding:10px;box-shadow:0 4px 0 rgba(0,0,0,.35),inset -4px -4px 0 #e2c995,inset 4px 4px 0 #fff8e6;position:relative}
.panel h2{font-family:'Press Start 2P';font-size:11px;background:var(--red);color:#fff;margin:-10px -10px 10px;padding:8px 10px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;gap:6px;line-height:1.4}
.panel h2 small{font-size:9px;color:var(--gold)}
.panel h3{font-family:'Press Start 2P';font-size:10px;margin:14px 0 8px;color:var(--red);line-height:1.4}
.hint{background:#fff;border-style:dashed}
.note{font-size:18px;color:#6b4a2e;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}.grid2 .panel{margin-right:5px}.grid2 .panel+.panel{margin-left:5px;margin-right:10px}}
.v3d{position:relative;margin:10px;height:40vh;min-height:230px;max-height:460px;border:4px solid var(--ink);background:#8fd3ff;box-shadow:0 4px 0 rgba(0,0,0,.35);overflow:hidden}
.v3d.big{height:52vh;max-height:560px}
.v3d canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:grab}
.v3d .ctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;z-index:2}
.v3d .ctl .hbtn{font-size:10px;padding:6px 8px}
.v3d .lbl{position:absolute;left:6px;top:6px;font-family:'Press Start 2P';font-size:7px;color:#fff;text-shadow:1px 1px 0 #000;z-index:2;pointer-events:none;line-height:1.5}
.v3d .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px;background:var(--paper)}
.queue{display:flex;flex-wrap:wrap;gap:8px;min-height:150px;align-content:flex-start}
.empty{color:#8a6a4a;font-size:20px;padding:30px 0;width:100%;text-align:center}
.cust{width:96px;background:#fff;border:3px solid var(--ink);padding:4px;text-align:center;cursor:pointer;animation:walkin .35s steps(4);box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:manipulation;position:relative}
.cust.del{background:#fff4dc;border-style:dashed}
.cust.ready{border-color:var(--green);background:#e8ffe9;animation:walkin .35s steps(4),pulse .8s steps(2) infinite}
.cust.shake{animation:shake .3s steps(3)}
@keyframes walkin{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--green),0 0 0 3px var(--green)}}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.cname{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{font-size:14px;line-height:1;color:#6b4a2e;min-height:28px;margin-top:2px}
.corder{min-height:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin:2px 0}
.pbar,.slot{height:8px;border:2px solid var(--ink);background:#ddd}
.pbar i,.slot i{display:block;height:100%;width:0;background:var(--green)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.station{background:#fff;border:3px solid var(--ink);padding:6px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.station:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.station.off{background:#999;filter:grayscale(1)}
.station.locked{opacity:.45;filter:grayscale(1);cursor:default;box-shadow:none}
.sname{font-family:'Press Start 2P';font-size:8px;margin:4px 0;min-height:16px;line-height:1.4}
.sstock{font-size:18px}
.slots{display:flex;gap:3px;margin:4px 0}
.slots .slot{flex:1}
.slots .slot i{background:#e8a33d}
.scost{font-size:15px;color:#8a6a4a}
.btn{font-family:'Press Start 2P';font-size:9px;background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 8px;cursor:pointer;text-shadow:1px 1px 0 var(--ink);line-height:1.4;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--green)}.btn.b{background:var(--blue)}.btn.y{background:var(--gold);color:var(--ink);text-shadow:none}
.btn.dis{background:#9a8f85}
.btn.big{font-size:11px;padding:12px 14px;width:100%;margin-top:10px}
.btn.sm{font-size:8px;padding:6px 6px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:8px}
.item.bigitem{background:#fff8e0;border-width:4px}
.item .info{flex:1;min-width:0}
.item .t{font-family:'Press Start 2P';font-size:9px;margin-bottom:4px;line-height:1.4}
.item .d{font-size:17px;color:#6b4a2e}
.pips{margin-top:3px}
.pips span{display:inline-block;width:12px;height:8px;border:2px solid var(--ink);margin-right:2px;background:#ddd}
.pips span.on{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:3px solid var(--ink);padding:5px 8px;background:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--gold);box-shadow:0 0 0 2px var(--red)}
.chip .sw{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.chip .sw2{width:8px;height:16px;display:inline-block}
.prow{background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:8px}
.prow .top{display:flex;align-items:center;gap:8px}
.prow .nums{font-size:18px;flex:1}
.prow .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.prow .btns .btn{flex:1}
.cheap{color:var(--blue)}.fair{color:var(--green)}.exp{color:var(--red)}
.city{background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:10px}
.city .head{display:flex;gap:10px;align-items:center}
.city .head .nm{font-family:'Press Start 2P';font-size:10px;line-height:1.4}
.city .stats{font-size:18px;margin:6px 0}
.city .ctr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.city.locked{opacity:.55}
.badge{display:inline-block;font-family:'Press Start 2P';font-size:7px;padding:3px 4px;border:2px solid var(--ink);background:var(--gold);margin-left:4px;vertical-align:middle;line-height:1.3}
.badge.r{background:var(--red);color:#fff}.badge.gr{background:var(--green);color:#fff}
.kv{display:flex;justify-content:space-between;border-bottom:2px dotted #d6bf8f;padding:3px 0;gap:8px}
.log{font-size:17px;max-height:220px;overflow:auto;background:#fff;border:3px solid var(--ink);padding:6px}
.log div{border-bottom:1px dashed #ddd;padding:2px 0}
.ach{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:2px dotted #d6bf8f;font-size:18px}
.ach .ic{width:18px;height:18px;border:3px solid var(--ink);background:#ddd;flex:none}
.ach.ok .ic{background:var(--gold)}
.ach:not(.ok){color:#8a7a6a}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--ink);border-top:4px solid #000;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#tabs .tb{flex:1;max-width:130px;background:transparent;border:3px solid transparent;color:#f4e4c1;font-family:'Press Start 2P';font-size:7px;padding:5px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
#tabs .tb.on{background:var(--red);border-color:#000;color:#fff}
#tabs .tb img{height:20px!important;width:auto!important}
#toasts{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;width:min(92vw,420px);pointer-events:none}
.toast{background:#fff;border:3px solid var(--ink);padding:6px 8px;margin-top:6px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .4s}
.toast.ok{background:#e8ffe9}.toast.warn{background:#ffe8e0}.toast.ev{background:var(--gold)}
.toast.out{opacity:0}
.float{position:absolute;z-index:45;transform:translateX(-50%);font-family:'Press Start 2P';font-size:11px;color:var(--green);text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff;pointer-events:none;animation:rise 1.1s steps(11) forwards;white-space:nowrap}
.float.bad{color:var(--red)}.float.say{color:var(--ink);font-size:9px}
@keyframes rise{to{transform:translate(-50%,-50px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,12,30,.82);display:flex;align-items:center;justify-content:center;padding:14px}
#modal.hidden{display:none}
.mbox{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 #000;max-width:460px;width:100%;padding:16px;text-align:center;max-height:92vh;overflow:auto}
.mbox .title{font-family:'Press Start 2P';font-size:22px;color:var(--red);text-shadow:3px 3px 0 var(--ink);line-height:1.4;margin-bottom:6px}
.mbox .sub{font-family:'Press Start 2P';font-size:9px;margin-bottom:12px;line-height:1.5}
.mbox p,.mbox li{text-align:left}
.mbox input,.mbox textarea,.panel input{width:100%;font-family:'VT323';font-size:22px;padding:6px;border:3px solid var(--ink);background:#fff;margin-top:4px}
.mbox textarea{height:90px;font-size:14px;word-break:break-all}
.mbox label{display:block;text-align:left;font-family:'Press Start 2P';font-size:8px;margin-top:8px}
.goal{font-size:19px;padding:3px 0}
.goal.ok{color:var(--green)}
</style>
</head>
<body>
<div id="app">
 <header id="hud">
  <div class="row"><span id="h-name"></span><span id="h-money"></span><button class="hbtn" id="h-speed" data-act="speed">x1</button><button class="hbtn" data-act="pause">II</button></div>
  <div class="row" style="margin-top:4px">
   <span class="hstat stars" id="h-rep"></span>
   <span class="hstat" id="h-day"></span>
   <span class="hstat" id="h-inf"></span>
   <span class="hstat" id="h-extra"></span>
  </div>
  <div class="daybar"><i id="h-dayb"></i></div>
 </header>
 <div id="banner"></div>
 <main id="view"></main>
</div>
<nav id="tabs"></nav>
<div id="toasts"></div>
<div id="modal" class="hidden"></div>
<script>

/* ================= BÁSICOS ================= */
const DAY_SEC = 30, SAVE_KEY = 'burgertycoon_v1', STOCK_MAX = 6, VERSION = 2;

const roundP = x => Math.max(100, Math.round(x / 100) * 100);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/* ---------- Pixel art 2D (interfaz) ---------- */

 brush:['......kk','.....kRk','....kRk.','...kRk..','..kkk...','.kbbk...','kbbk....','kkk.....']
};
const sprCache = {};
function spr(name, over) {
 const key = name + (over ? JSON.stringify(over) : '');
 if (sprCache[key]) return sprCache[key];
 const rows = SPR[name], h = rows.length, w = rows[0].length;
 const c = document.createElement('canvas'); c.width = w; c.height = h;
 const x = c.getContext('2d');
 for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
  const ch = rows[j][i]; if (ch === '.') continue;
  x.fillStyle = (over && over[ch]) || PAL[ch] || '#f0f'; x.fillRect(i, j, 1, 1);
 }
 return sprCache[key] = c.toDataURL();
}
const img = (name, size, over) => `<img class="spr" src="${spr(name, over)}" style="width:${size}px" alt="">`;

const SHIRTS = ['#e04a3a','#3b82c4','#5cb85c','#9b59b6','#f39c12','#1abc9c','#e84393','#34495e','#75aadb','#c0392b'];

/* ---------- Datos de juego ---------- */

const PKEYS = Object.keys(PRODUCTS);
const UPG = {
 speed:{name:'Plancha industrial',desc:'Cocinás 20% más rápido',costs:[50000,160000,450000]},
 slots:{name:'Más hornallas',desc:'+1 producto en simultáneo por estación',costs:[80000,300000]},

function deepMerge(a, b) {
 for (const k in b) {
  if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
  else a[k] = b[k];
 }
 return a;
}
function sanitize(st) {
 PKEYS.forEach(k => { const p = st.p[k]; if (!Array.isArray(p.cooking)) p.cooking = []; if (!(p.price > 0)) p.price = PRODUCTS[k].ref; if (!(p.ratio > 0)) p.ratio = 1; });
 for (const k in st.p) if (!PRODUCTS[k]) delete st.p[k];
 st.q = (st.q || []).filter(c => c && Array.isArray(c.order) && c.order.every(k => PRODUCTS[k]));
 if (st.ev && !EVMAP[st.ev.id]) st.ev = null;
 for (const id in st.br) if (!CITY[id]) delete st.br[id];
 if (!WALLS[st.cos.wall]) st.cos.wall = 'crema';
 if (!AWNINGS[st.cos.awning]) st.cos.awning = 'rojo';
 if (!UNIFORMS[st.cos.uniform]) st.cos.uniform = 'blanco';
 if (!FLOORS[st.cos.floor]) st.cos.floor = 'cemento';
 if (!SIGNS[st.cos.sign]) st.cos.sign = 'basico';
 if (![1, 2, 3].includes(st.speed)) st.speed = 1;
 if (!['pixel','hd','off'].includes(st.gfx)) st.gfx = 'pixel';
 st.v = VERSION;
 return st;
}

const nf = new Intl.NumberFormat('es-AR', {maximumFractionDigits:0});
function money(n) {
 const a = Math.abs(n), sg = n < 0 ? '-' : '';
 if (a >= 1e9) return sg + '$' + (a / 1e9).toFixed(2).replace('.', ',') + ' mil M';
 if (a >= 1e7) return sg + '$' + (a / 1e6).toFixed(1).replace('.', ',') + ' M';
 return sg + '$' + nf.format(Math.round(a));
}
const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';
function stars(r) { const f = Math.round(r); let s = ''; for (let i = 0; i < 5; i++) s += i < f ? '★' : '<span class="off">★</span>'; return s + ' ' + r.toFixed(1).replace('.', ','); }
const hourOf = () => 11 + S.dayT / DAY_SEC * 14;
function clock() { const h = hourOf(), hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 4) * 15; return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }

/* ---------- Sonido 8 bits ---------- */
let AC = null;
function sfx(type) {
 if (!S || S.muted) return;
 try {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  const f = {tap:[440,660],coin:[988,1319],err:[220,140],buy:[523,784],ev:[330,660],day:[392,523],ach:[659,1047]}[type] || [440,440];
  o.type = 'square'; o.frequency.setValueAtTime(f[0], t); o.frequency.setValueAtTime(f[1], t + 0.07);
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.22);
 } catch (e) {}
}

/* ---------- Mensajes ---------- */
const lastToast = {};
function toast(msg, cls = '', key) {
 if (key) { const n = performance.now(); if (lastToast[key] && n - lastToast[key] < 4000) return; lastToast[key] = n; }
 const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg;
 const box = $('#toasts'); box.append(t);
 while (box.children.length > 3) box.firstChild.remove();
 setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3000);
}
function floatAt(el, txt, cls) {
 if (!el || !el.isConnected) return;
 const r = el.getBoundingClientRect(); if (!r.width) return;
 const d = document.createElement('div');
 d.className = 'float ' + (cls || ''); d.textContent = txt;
 d.style.left = (r.left + r.width / 2 + window.scrollX) + 'px'; d.style.top = (r.top + window.scrollY) + 'px';
 document.body.appendChild(d); setTimeout(() => d.remove(), 1100);
}
function log(msg) { S.log.unshift('Día ' + S.day + ': ' + msg); S.log = S.log.slice(0, 15); }
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.remove('hidden'); paused = true; }

const mkt = k => PRODUCTS[k].ref * S.I;
const evP = n => S.ev ? EVMAP[S.ev.id][n] : undefined;
const unitCost = k => PRODUCTS[k].ref * S.I * 0.35 * (1 - 0.1 * S.upg.supplier) * (evP('costMul') || 1);
const cookTime = k => PRODUCTS[k].time * Math.pow(0.8, S.upg.speed);
const slots = () => 1 + S.upg.slots;
const qcap = () => 4 + 2 * S.upg.salon + (S.cos.items.terraza ? 2 : 0);
const blue = () => 1450 * S.I * (1 + S.blue);
const patrimonio = () => S.money + S.usd * blue() * 0.98;
const has = k => !!S.cos.items[k];
function decoPts() {
 let d = FLOORS[S.cos.floor].deco + SIGNS[S.cos.sign].deco;
 for (const k in ITEMS) if (has(k)) d += ITEMS[k].deco;
 return d;
}
function evPat() {
 let m = evP('patMul') || 1;
 if (S.ev && S.ev.id === 'calor' && has('aire')) m = 1;
 if (S.ev && S.ev.id === 'clasico' && has('tele')) m = 1.5;
 return m;
}
const patBase = () => 24 * (1 + Math.min(0.5, 0.02 * decoPts())) * (has('piso2') ? 1.1 : 1);
function earn(x) { S.money += x; S.earned += x; S.dayStats.rev += x; }
function spend(x) { S.money -= x; S.dayStats.cost += x; }
function pay(c) {
 if (S.money < c) { sfx('err'); toast('No te alcanza: faltan ' + money(c - S.money), 'warn', 'nomoney'); return false; }
 S.money -= c; sfx('buy'); return true;
}
function spawnInterval() {
 let b = 7 / (1 + 0.3 * S.upg.sign) / (0.55 + S.rep * 0.15) / (1 + Math.min(0.3, 0.01 * decoPts())) / (has('piso2') ? 1.15 : 1);
 if (S.phase >= 2) b /= 1 + 0.1 * S.corp.marca;
 return b / (evP('spawnMul') || 1);
}
function makeOrder() {
 const un = PKEYS.filter(k => S.p[k].unlocked), tw = un.reduce((a, k) => a + PRODUCTS[k].w, 0);
 const n = Math.random() < 0.5 ? 1 : Math.random() < 0.7 ? 2 : 3, o = [];
 for (let i = 0; i < n; i++) { let r = Math.random() * tw; for (const k of un) { r -= PRODUCTS[k].w; if (r <= 0) { o.push(k); break; } } }
 if (!o.length) o.push(un[0]);
 return o.sort((a, b) => PKEYS.indexOf(a) - PKEYS.indexOf(b));
}
function acceptPrice(order) {
 const price = order.reduce((a, k) => a + S.p[k].price, 0), ref = order.reduce((a, k) => a + mkt(k), 0);
 return Math.random() <= clamp(1.9 - price / ref, 0.03, 1);
}
function sellAchilata() {
 if (!has('cart')) return;
 if (Math.random() < 0.25 * (S.ev && S.ev.id === 'calor' ? 3 : 1)) { earn(3000 * S.I); S.stats.achilata++; G3.achiPop = 0.6; }
}
function trySpawn() {

 const pat = patBase() * evPat() * (0.85 + Math.random() * 0.3);
 const say = order.includes('mila') && Math.random() < 0.7 ? rnd(SAYS_MILA) : rnd(SAYS);

}
function trySpawnDelivery() {

function canServe(c) {
 const need = {}; c.order.forEach(k => need[k] = (need[k] || 0) + 1);
 return Object.keys(need).every(k => S.p[k].stock >= need[k]);
}
function serve(id, auto) {
 const i = S.q.findIndex(c => c.id === id); if (i < 0) return false;
 const c = S.q[i], el = document.getElementById('c' + id);
 if (!canServe(c)) { if (!auto) { sfx('err'); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } toast('Todavía no está listo el pedido', 'warn', 'notready'); } return false; }
 c.order.forEach(k => S.p[k].stock--);
 const rev = c.order.reduce((a, k) => a + S.p[k].price, 0), frac = c.pat / c.max;
 const tip = c.del ? 0 : Math.round(rev * 0.15 * frac);
 const gain = c.del ? Math.round(rev * 0.85) : rev + tip;
 const r = rev / c.order.reduce((a, k) => a + mkt(k), 0);
 earn(gain);
 S.rep = clamp(S.rep + 0.035 * (frac - 0.25) - (r > 1.3 ? 0.03 : 0), 0, 5);
 S.stats.mila += c.order.filter(k => k === 'mila').length;
 if (c.del) { S.stats.delivery++; G3.motoTrip = 1; }
 S.q.splice(i, 1); S.stats.served++; G3.leave[id] = 'happy';
 floatAt(el, '+' + money(gain));
 if (c.order.includes('mila') && Math.random() < 0.5) setTimeout(() => floatAt(document.querySelector('#queue'), '¿Cómo lo querí\'?', 'say'), 150);
 sfx('coin');
 return true;
}
function cook(k, auto) {
 const p = S.p[k]; if (!p || !p.unlocked) return false;
 const fail = m => { if (!auto) { sfx('err'); if (m) toast(m, 'warn', m); } return false; };
 if (evP('noCook')) return fail('Sin luz no se cocina');
 if (p.cooking.length >= slots()) return fail('');
 if (p.stock + p.cooking.length >= STOCK_MAX) return fail('El mostrador está lleno');
 const c = unitCost(k); if (S.money < c) return fail('No te alcanza para los insumos');
 spend(c); const t = cookTime(k); p.cooking.push({t, total:t}); if (!auto) sfx('tap');
 return true;
}
function aiCook() {
 const need = {}; S.q.forEach(c => c.order.forEach(k => need[k] = (need[k] || 0) + 1));
 let best = null, bs = 0;
 for (const k of PKEYS) {
  const p = S.p[k]; if (!p.unlocked || p.cooking.length >= slots()) continue;
  const have = p.stock + p.cooking.length, sc = (need[k] || 0) - have + (have < 1 ? 0.5 : 0);
  if (sc > bs) { bs = sc; best = k; }
 }
 if (best) cook(best, true);
}
function aiServe() {
 const c = S.q.filter(canServe).sort((a, b) => a.pat - b.pat)[0];
 if (c) serve(c.id, true);
}
function startEvent() {
 const pool = EVENTS.filter(e => !(e.id === 'bromato' && S.day < 3) && !(e.id === 'deval' && S.day < 4));
 let r = Math.random() * pool.reduce((a, e) => a + e.w, 0), e = pool[0];
 for (const x of pool) { r -= x.w; if (r <= 0) { e = x; break; } }
 S.ev = {id:e.id, t:e.dur, dur:e.dur, msg:e.desc};
 if (e.id === 'deval') {
  S.I *= 1.1; S.inf = Math.min(0.3, S.inf + 0.06); S.blue += 0.12; S.stats.devals++;
  S.ev.msg = 'Los precios de mercado saltaron 10% y la inflación se acelera. ¡Remarcá!';
 }
 if (e.id === 'bromato') {
  if (S.rep >= 3.5 || decoPts() >= 6) { S.rep = Math.min(5, S.rep + 0.2); S.ev.msg = 'Aprobaste con felicitaciones: +reputación'; }
  else { const f = Math.round(Math.max(0, S.money) * 0.08 + 20000 * S.I); S.money -= f; S.ev.msg = 'Multa de ' + money(f) + '. Subí la reputación o decorá el local.'; }
 }
 if (e.id === 'clasico' && has('tele')) S.ev.msg += '. Tu tele los tiene atrapados';
 if (e.id === 'calor' && has('cart')) S.ev.msg += '. El carrito de achilata no da abasto';
 log(e.title + (S.ev.msg ? ': ' + S.ev.msg : ''));
 sfx('ev'); S.evT = 55 + Math.random() * 75;
}
function endDay() {
 const I = S.I; let wages = 0;
 for (const k in STAFF) wages += STAFF[k].wage * S.staff[k] * I;
 const rent = 20000 * I * (1 + 0.5 * S.upg.salon) * (has('piso2') ? 1.5 : 1);
 spend(wages + rent);
 if (S.money < 0) { const int = -S.money * 0.02; spend(int); toast('Estás en rojo: el banco te cobra ' + money(int) + ' de interés', 'warn'); }
 if (S.staff.contador) PKEYS.forEach(k => { const p = S.p[k]; if (p.unlocked) p.price = roundP(p.ratio * mkt(k)); });
 S.inf = clamp(S.inf + (0.05 - S.inf) * 0.04 + (Math.random() - 0.5) * 0.012, 0.01, 0.35);
 if (S.phase >= 2) chainDay();
 const net = S.dayStats.rev - S.dayStats.cost;
 toast('Cierre del día ' + S.day + ': ' + (net >= 0 ? '+' : '') + money(net), net >= 0 ? 'ok' : 'warn');
 sfx('day'); S.day++; S.dayStats = {rev:0, cost:0}; save();
}
function checkAch() {
 for (const a of ACH) if (!S.ach[a.id] && a.cond()) {
  S.ach[a.id] = S.day; const rw = a.rew * S.I; if (rw) S.money += rw;
  toast('Logro: ' + a.name + (rw ? ' (+' + money(rw) + ')' : ''), 'ev'); sfx('ach'); log('Logro desbloqueado: ' + a.name);
 }
}

/* ---------- Cadena ---------- */
function bCalc(id) {
 const c = CITY[id], b = S.br[id], I = S.I, pol = POLMUL[b.policy];
 const eff = pol * S.list / I / c.wealth;
 const df = clamp(1 - (eff - 1) * 1.4, 0.1, 1.7);
 const q = Math.min(1.2, 0.35 + 0.15 * b.staff + 0.15 * b.mgr + 0.05 * S.corp.compras + 0.05 * S.corp.escuela);
 const boost = b.boostT > 0 ? b.boostMul : 1;
 let mk = c.market;
 if (id === 'fam' && S.p.empanada.unlocked) mk *= 1.4;
 if (id === 'sim' && S.ev && S.ev.id === 'simoca') mk *= 2.5;
 const demand = mk * df * (1 + 0.2 * S.corp.marca) * (0.5 + 0.5 * q) * (1 + 0.15 * b.mkt) * boost * (0.6 + 0.6 * b.rep);
 const cap = 40 * b.staff * [0.8, 1.1, 1.35][b.mgr];
 const closed = b.closedT > 0, sales = closed ? 0 : Math.min(demand, cap);
 const ticket = 11000 * S.list * pol, rev = sales * ticket;
 const food = sales * 11000 * I * 0.4 * (1 - 0.08 * S.corp.compras);
 const wages = (b.staff * 70000 + [0, 60000, 160000][b.mgr] * (S.corp.escuela ? 0.7 : 1)) * I;
 const cost = food + wages + c.rent * I + b.mkt * 50000 * I;
 const sat = clamp(0.25 + 0.5 * q - (demand > cap ? 0.3 * (1 - cap / demand) : 0) - Math.max(0, eff - 1) * 0.5 + Math.max(0, 1 - eff) * 0.3, 0, 1);
 return {demand, cap, sales, rev, cost, profit:rev - cost, sat, q, closed, eff};
}
function chainProfit() { let t = 0; for (const id in S.br) t += bCalc(id).profit; return t; }
function chainTick(dt) { const f = dt / DAY_SEC; for (const id in S.br) { const r = bCalc(id); earn(r.rev * f); spend(r.cost * f); } }
const BEV = [
 {t:'reseña viral en TikTok: +60% de demanda por 3 días', good:true, fn:b => { b.boostT = 3; b.boostMul = 1.6; }},
 {t:'hay un recital en la ciudad: +50% de demanda hoy', good:true, fn:b => { b.boostT = 1; b.boostMul = 1.5; }},
 {t:'renunció el encargado', cond:b => b.mgr === 1, fn:b => { b.mgr = 0; }},
 {t:'clausura de bromatología por 2 días', cond:(b, r) => r.q < 0.75, fn:b => { b.closedT = 2; }},
 {t:'paro gastronómico: cerrado 1 día', cond:b => b.mgr < 2, fn:b => { b.closedT = Math.max(b.closedT, 1); }},
 {t:'se rompió la freidora (-' , cost:300000, fn:() => {}}
];
function chainDay() {
 if (S.corp.contador) S.list = S.I;
 for (const id in S.br) {
  const b = S.br[id], r = bCalc(id);
  b.rep = clamp(b.rep + (r.sat - b.rep) * 0.2, 0, 1);
  if (b.boostT > 0) b.boostT--; if (b.closedT > 0) b.closedT--;
  if (Math.random() < 0.07 * (b.mgr === 0 ? 1.6 : 1)) {
   const pool = BEV.filter(e => !e.cond || e.cond(b, r)), e = rnd(pool);
   let txt = e.t;
   if (e.cost) { const c = e.cost * S.I; spend(c); txt += money(c) + ')'; }
   e.fn(b); const msg = CITY[id].name + ': ' + txt; log(msg); toast(msg, e.good ? 'ok' : 'warn');
  }
 }
}
function goals() {
 return [
  ['Menú completo (' + PKEYS.length + ' productos)', PKEYS.every(k => S.p[k].unlocked)],
  ['Parrillero y cajero contratados', S.staff.parrillero > 0 && S.staff.cajero > 0],
  ['Reputación de 4★ o más', S.rep >= 4],
  ['Decoración de 8 puntos o más (tenés ' + decoPts() + ')', decoPts() >= 8],
  ['Patrimonio de ' + money(3e6 * S.I) + ' (plata + dólares)', patrimonio() >= 3e6 * S.I]
 ];
}

/* ---------- Bucle de juego ---------- */
let achT = 0;
function tick(dt) {
 S.t += dt;
 S.I *= Math.pow(1 + S.inf, dt / (DAY_SEC * 30));
 S.blue = clamp(S.blue + (Math.random() - 0.5) * 0.03 * dt + (0.03 - S.blue) * 0.01 * dt, -0.08, 0.5);
 if (S.ev) { S.ev.t -= dt; if (S.ev.t <= 0) S.ev = null; }
 else { S.evT -= dt; if (S.evT <= 0) startEvent(); }
 if (!evP('noCook')) for (const k of PKEYS) {
  const p = S.p[k];
  p.cooking.forEach(c => c.t -= dt);
  while (p.cooking.length && p.cooking[0].t <= 0) { p.cooking.shift(); p.stock++; }
 }
 S.spawnT -= dt;
 if (S.spawnT <= 0) { trySpawn(); S.spawnT = spawnInterval() * (0.6 + Math.random() * 0.8); }
 if (has('moto')) { S.delT -= dt; if (S.delT <= 0) { trySpawnDelivery(); S.delT = 14 / (0.55 + S.rep * 0.15) * (0.7 + Math.random() * 0.6); } }
 for (let i = S.q.length - 1; i >= 0; i--) {
  const c = S.q[i]; c.pat -= dt;
  if (c.pat <= 0) {
   floatAt(document.getElementById('c' + c.id), c.del ? 'Pedido cancelado' : '¡Me voy!', 'bad');
   S.q.splice(i, 1); S.stats.lost++; S.rep = clamp(S.rep - (c.del ? 0.06 : 0.1), 0, 5); G3.leave[c.id] = 'angry'; sfx('err');
  }
 }
 if (S.staff.parrillero) { S.ai.p -= dt; if (S.ai.p <= 0) { aiCook(); S.ai.p = [0, 1.8, 1.1, 0.6][S.staff.parrillero]; } }
 if (S.staff.cajero) { S.ai.c -= dt; if (S.ai.c <= 0) { aiServe(); S.ai.c = [0, 2.2, 1.3, 0.7][S.staff.cajero]; } }
 if (S.phase >= 2) chainTick(dt);
 S.dayT += dt; if (S.dayT >= DAY_SEC) { S.dayT -= DAY_SEC; endDay(); }
 achT += dt; if (achT > 1) { achT = 0; checkAch(); }
}

function adjPrice(k, f) { const p = S.p[k]; p.price = roundP(p.price * f); p.ratio = p.price / mkt(k); }

  const lv = S.corp[k], cs = CORP[k].costs; if (lv >= cs.length) return;

  if (pay(ITEMS[k].cost * S.I)) { S.cos.items[k] = 1; toast('Compraste: ' + ITEMS[k].name, 'ok'); log('Compraste ' + ITEMS[k].name); G3.dirty = true; }

 } else if (kind === 'signs') {

  else if (pay(SIGNS[k].cost * S.I)) { S.cos.signs[k] = 1; S.cos.sign = k; }
  G3.dirty = true;
 }
}

function branchAct(a, id) {

 } else if (!b) return;
 else if (a === 'bstaff') { if (b.staff < 4 && pay(1.2e6 * b.staff * I)) b.staff++; }
 else if (a === 'bmgr') { if (b.mgr === 0 && pay(1e6 * I)) b.mgr = 1; }
 else if (a === 'bmgr2') { if (b.mgr < 2 && S.corp.escuela && pay(4e6 * I)) b.mgr = 2; }
 else if (a === 'bpol') { b.policy = (b.policy + 1) % 3; sfx('tap'); }

function act(a, arg) {
 switch (a) {
  case 'cook': cook(arg, false); break;
  case 'serve': serve(+arg, false); break;
  case 'tab': tab = arg; sfx('tap'); window.scrollTo(0, 0); break;
  case 'price': { const [k, f] = arg.split(':'); adjPrice(k, +f); sfx('tap'); break; }
  case 'remarcar': PKEYS.forEach(k => { const p = S.p[k]; if (p.unlocked) p.price = roundP(p.ratio * mkt(k)); }); sfx('buy'); toast('Remarcaste toda la carta', 'ok'); break;
  case 'igualar': PKEYS.forEach(k => { const p = S.p[k]; if (p.unlocked) { p.price = roundP(mkt(k)); p.ratio = 1; } }); sfx('buy'); break;
  case 'buy': buy(arg); break;
  case 'cos': setCos(arg); break;
  case 'rename': { const n = ($('#rn').value || '').trim().slice(0, 22); if (n) { S.name = n; G3.dirty = true; sfx('buy'); toast('Ahora te llamás ' + n, 'ok'); } break; }
  case 'found': foundChain(); break;
  case 'open': case 'bstaff': case 'bmgr': case 'bmgr2': case 'bpol': case 'bmkt': branchAct(a, arg); break;
  case 'list': S.list = S.I; sfx('buy'); toast('Lista de precios actualizada en toda la cadena', 'ok'); break;
  case 'ipo': if (Object.keys(S.br).length >= IPO_BRANCHES && S.corp.marca >= 3 && pay(IPO_COST * S.I)) ending(); break;
  case 'usdbuy': {
   const rate = blue() * 1.02, max = Math.floor(Math.max(0, S.money) / rate), n = arg === 'all' ? max : Math.min(+arg, max);
   if (n <= 0) { sfx('err'); toast('No te alcanza para comprar dólares', 'warn'); break; }
   S.money -= n * rate; S.usd += n; sfx('buy'); toast('Compraste US$ ' + nf.format(n) + ' a ' + money(rate), 'ok'); break;
  }
  case 'usdsell': {
   const n = arg === 'all' ? S.usd : Math.min(+arg, S.usd);
   if (n <= 0) { sfx('err'); break; }
   const rate = blue() * 0.98; S.usd -= n; S.money += n * rate; sfx('coin'); toast('Vendiste US$ ' + nf.format(n) + ' a ' + money(rate), 'ok'); break;
  }
  case 'pause': if (paused && $('#modal .mbox')) { pauseMenu(); } else pauseMenu(); break;

  case 'speed2': S.speed = S.speed % 3 + 1; pauseMenu(); break;

  case 'mute': S.muted = !S.muted; break;
  case 'mute2': S.muted = !S.muted; pauseMenu(); break;
  case 'help': helpModal(); break;
  case 'backup': backupModal(); break;
  case 'copy': { const t = $('#bk-out'); try { navigator.clipboard.writeText(t.value).then(() => toast('Código copiado', 'ok'), () => { t.select(); toast('Seleccioná y copiá el código a mano', 'warn'); }); } catch (e) { t.select(); } break; }
  case 'import': {
   try { const d = JSON.parse(decodeURIComponent(escape(atob(($('#bk-in').value || '').trim())))); if (!d || !d.p) throw 0; S = fromJSON(d); save(); G3.reset(); closeModal(); toast('Partida cargada', 'ok'); }
   catch (e) { toast('El código no es válido', 'warn'); }
   break;
  }
  case 'reset': modal(`<div class="sub">¿Borrar la partida y empezar de cero?</div><button class="btn big" data-act="doreset">Sí, borrar todo</button><button class="btn big b" data-act="pause">Cancelar</button>`); break;
  case 'doreset': try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = newState(); tab = 'cocina'; G3.reset(); intro(); break;
  case 'start': { const n = ($('#nm').value || '').trim().slice(0, 22) || 'La Esquina'; S = newState(n); G3.reset(); closeModal(); save(); break; }
  case 'close': closeModal(); break;
  case 'rot': G3.theta += +arg; break;
  case 'zoom': G3.zoom = clamp(G3.zoom * +arg, 0.6, 2.6); break;
 }
 render();
}
/* Toque rápido: se dispara al soltar, y se cancela si el dedo se movió (para poder scrollear) */
let tapStart = null;
document.addEventListener('pointerdown', e => {
 const t = e.target.closest('[data-fast]');
 if (!t || paused) { tapStart = null; return; }
 tapStart = {id:e.pointerId, x:e.clientX, y:e.clientY, a:t.dataset.fast, arg:t.dataset.arg, t:performance.now()};
});
document.addEventListener('pointerup', e => {
 if (!tapStart || e.pointerId !== tapStart.id) return;
 const s = tapStart; tapStart = null;
 if (paused || Math.hypot(e.clientX - s.x, e.clientY - s.y) > 14 || performance.now() - s.t > 800) return;
 act(s.a, s.arg);
});
document.addEventListener('pointercancel', () => tapStart = null);
document.addEventListener('click', e => {
 const t = e.target.closest('[data-act]'); if (!t) return;
 act(t.dataset.act, t.dataset.arg);
});
document.addEventListener('keydown', e => {
 if (!S || (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
 if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); if (paused) closeModal(); else pauseMenu(); render(); return; }
 if (paused) return;
 const n = parseInt(e.key, 10);
 if (n >= 1 && n <= PKEYS.length) { cook(PKEYS[n - 1], false); render(); }
 if (e.code === 'Space') { e.preventDefault(); const c = S.q.filter(canServe).sort((a, b) => a.pat - b.pat)[0]; if (c) serve(c.id, false); else sfx('err'); render(); }
});

/* ================= 3D VOXEL ================= */
const G3 = {ok:false, failed:false, theta:0.65, phi:0.72, zoom:1, dirty:true, people:{}, leave:{}, seats:[], seatUsed:{}, smoke:[], clouds:[], foods:{}, emis:[], walls:[], motoTrip:0, achiPop:0, staffMeshes:{}, resized:true,
 reset() { this.dirty = true; this.leave = {}; this.seatUsed = {}; if (!this.ok) return; for (const id in this.people) this.scene.remove(this.people[id].g); this.people = {}; }};
const shade = (hex, f) => { const c = new THREE.Color(hex); c.multiplyScalar(f); return '#' + c.getHexString(); };
function mat(c, em) {

  ${Object.keys(STAFF).map(k => itemHTML(img('chef', 24), STAFF[k].name + (S.staff[k] ? ' nv' + S.staff[k] : ''), STAFF[k].desc + '. Sueldo ' + money(STAFF[k].wage * S.I) + '/día por nivel', S.staff[k], STAFF[k].costs.length, 'buy', 'staff:' + k, (STAFF[k].costs[S.staff[k]] || 0) * S.I)).join('')}
  <div class="note">Sueldos y alquiler se pagan al cierre de cada día y suben con la inflación.</div></section>`);
}
function vLocal(v) {
 const C = S.cos;
 setKey(v, 'local' + S.gfx, () => `${v3dHTML('v3d-l', true)}<section class="panel"><h2>Nombre del local</h2><div style="display:flex;gap:6px;align-items:stretch"><input id="rn" maxlength="22" value="${esc(S.name)}"><button class="btn" data-act="rename">OK</button></div></section><div id="loc"></div>`);
 mount3D('#v3d-l');
 const key = JSON.stringify(C) + S.name + Math.round(S.I * 50);
 const chips = (k, obj, sw) => `<div class="chips">${Object.keys(obj).map(v => `<div class="chip ${C[k] === v ? 'on' : ''}" data-act="cos" data-arg="${k}:${v}">${sw(obj[v])}${v}</div>`).join('')}</div>`;
 const own = (k, objKey, obj, act) => Object.keys(obj).map(v => {
  const o = obj[v], owned = C[objKey][v], on = C[k] === v;
  return `<div class="item"><div class="info"><div class="t">${o.name}</div><div class="d">Decoración +${o.deco}</div></div>${on ? '<span class="badge gr">EN USO</span>' : owned ? `<button class="btn b" data-act="buy" data-arg="${act}:${v}">Usar</button>` : costBtn('buy', act + ':' + v, o.cost * S.I)}</div>`;
 }).join('');
 setKey($('#loc'), key, () => `<section class="panel"><h2>Tu local <small>Decoración ${decoPts()}</small></h2>
  <div class="note" style="margin-top:0">Cada punto de decoración trae más clientes y los hace esperar más (hasta +50% de paciencia).</div>
  <h3>Paredes</h3>${chips('wall', WALLS, c => `<span class="sw" style="background:${c}"></span>`)}
  <h3>Toldo y cartel</h3>${chips('awning', AWNINGS, c => `<span class="sw" style="display:flex;padding:0"><span class="sw2" style="background:${c[0]}"></span><span class="sw2" style="background:${c[1]}"></span></span>`)}
  <h3>Uniforme</h3>${chips('uniform', UNIFORMS, c => `<span class="sw" style="background:${c}"></span>`)}
  </section>
  <section class="panel"><h2>Piso</h2>${own('floor', 'floors', FLOORS, 'floor')}</section>
  <section class="panel"><h2>Cartel</h2>${own('sign', 'signs', SIGNS, 'signs')}</section>
  <section class="panel"><h2>Decoración</h2>${Object.keys(ITEMS).filter(k => !ITEMS[k].big).map(k => itemHTML(img('brush', 22), ITEMS[k].name, ITEMS[k].desc + ' · Decoración +' + ITEMS[k].deco, has(k) ? 1 : 0, 1, 'buy', 'item:' + k, ITEMS[k].cost * S.I)).join('')}</section>
  <section class="panel"><h2>Compras grandes</h2>${Object.keys(ITEMS).filter(k => ITEMS[k].big).map(k => itemHTML(img(k === 'cart' ? 'achilata' : k === 'moto' ? 'moto' : 'store', 30), ITEMS[k].name, ITEMS[k].desc + ' · Decoración +' + ITEMS[k].deco, has(k) ? 1 : 0, 1, 'buy', 'item:' + k, ITEMS[k].cost * S.I, 'bigitem')).join('')}</section>`);
}
function branchHTML(id) {
 const c = CITY[id], b = S.br[id], I = S.I;
 if (!b) {
  const locked = S.corp.logistica < c.log;
  const wl = c.wealth >= 1.3 ? 'muy alto' : c.wealth >= 1.05 ? 'alto' : c.wealth >= 0.95 ? 'medio' : 'bajo';
  return `<div class="city ${locked ? 'locked' : ''}"><div class="head">${img('store', 56, {R:'#888', c:'#555'})}<div><div class="nm">${c.name}</div><div class="d">${c.prov} · se alquila</div></div></div>
   <div class="stats">Mercado: ${c.market} clientes/día · Poder adquisitivo ${wl} · Alquiler ${money(c.rent * I)}/día${c.note ? '<br><i>' + c.note + '</i>' : ''}</div>
   ${locked ? `<span class="badge r">Requiere Logística nv${c.log}</span>` : costBtn('open', id, c.cost * I, 'Abrir sucursal · ' + money(c.cost * I), 'g')}</div>`;
 }
 const mg = ['Sin encargado', 'Encargado', 'Encargado estrella'][b.mgr];
 return `<div class="city"><div class="head">${img('store', 56)}<div style="flex:1"><div class="nm">${c.name} <span id="bb-${id}"></span></div><div class="d">${c.prov} · ${mg}</div></div></div>
  <div class="stats" id="bs-${id}"></div>
  <div class="ctr">
   <button class="btn b sm" data-act="bpol" data-arg="${id}">Precios: ${POLICY[b.policy]}</button>
   ${b.staff < 4 ? costBtn('bstaff', id, 1.2e6 * b.staff * I, 'Personal nv' + (b.staff + 1) + ' · ' + money(1.2e6 * b.staff * I), 'sm') : '<span class="badge gr">Personal al máximo</span>'}
   ${b.mgr === 0 ? costBtn('bmgr', id, 1e6 * I, 'Encargado · ' + money(1e6 * I), 'sm') : b.mgr === 1 ? (S.corp.escuela ? costBtn('bmgr2', id, 4e6 * I, 'Estrella · ' + money(4e6 * I), 'sm y') : '<span class="badge">Estrella: requiere Escuela</span>') : '<span class="badge gr">Encargado estrella</span>'}
   ${b.mkt < 3 ? costBtn('bmkt', id, 0.8e6 * (b.mkt + 1) * I, 'Marketing nv' + (b.mkt + 1) + ' · ' + money(0.8e6 * (b.mkt + 1) * I), 'sm') : '<span class="badge gr">Marketing al máximo</span>'}
  </div></div>`;
}
function vCadena(v) {
 const n = Object.keys(S.br).length, ipoOk = n >= IPO_BRANCHES && S.corp.marca >= 3;
 const key = 'cad' + JSON.stringify([S.br, S.corp, S.won]) + Math.round(S.I * 50);
 setKey(v, key, () => `<section class="panel"><h2>Tu cadena <small id="cinfo"></small></h2>
  <div class="kv"><span>Ganancia de la cadena</span><b id="cprof"></b></div>
  <div class="kv"><span>Lista de precios vs. inflación</span><b id="clist"></b></div>
  ${S.corp.contador ? '<div class="note">El estudio contable actualiza la lista todos los días.</div>' : '<button class="btn big" data-act="list">Actualizar lista de precios</button><div class="note">Si la lista queda atrasada, vendés más pero con menos margen.</div>'}
  </section><section class="panel"><h2>Oficina corporativa</h2>
  ${Object.keys(CORP).map(k => itemHTML(img('tower', 22), CORP[k].name, CORP[k].desc, S.corp[k], CORP[k].costs.length, 'buy', 'corp:' + k, (CORP[k].costs[S.corp[k]] || 0) * S.I)).join('')}
  </section><section class="panel"><h2>Sucursales</h2>
  <div class="city"><div class="head">${img('store', 56)}<div><div class="nm">${esc(S.name)} <span class="badge">Casa central</span></div><div class="d">San Miguel de Tucumán · la atendés vos</div></div></div></div>
  ${CITIES.map(c => branchHTML(c.id)).join('')}</section>
  <section class="panel"><h2>Salir a la bolsa</h2>
  <div class="goal ${n >= IPO_BRANCHES ? 'ok' : ''}">${n >= IPO_BRANCHES ? '■' : '□'} ${IPO_BRANCHES} sucursales o más (${n})</div>
  <div class="goal ${S.corp.marca >= 3 ? 'ok' : ''}">${S.corp.marca >= 3 ? '■' : '□'} Campaña nacional nivel 3</div>
  ${S.won ? '<span class="badge gr">Ya cotizás en la bolsa</span>' : ipoOk ? costBtn('ipo', '', IPO_COST * S.I, 'Tocar la campana · ' + money(IPO_COST * S.I), 'big y') : '<div class="note">El final del juego: convertí tu cadena en una empresa que cotiza en la Bolsa de Comercio.</div>'}
  </section>`);
 $('#cinfo').textContent = n + '/' + CITIES.length;
 const cp = chainProfit(), cpe = $('#cprof'); cpe.textContent = money(cp) + '/día'; cpe.className = cp >= 0 ? 'fair' : 'exp';
 const lag = S.list / S.I - 1, cl = $('#clist'); cl.textContent = (lag >= 0 ? '+' : '') + pct(lag); cl.className = lag < -0.08 ? 'exp' : lag < -0.03 ? 'cheap' : 'fair';
 for (const id in S.br) {
  const r = bCalc(id), b = S.br[id], el = $('#bs-' + id); if (!el) continue;
  el.innerHTML = `Ventas ${Math.round(r.sales)}/día · Demanda ${Math.round(r.demand)} · Capacidad ${Math.round(r.cap)}<br>
   Satisfacción ${Math.round(b.rep * 100)}% · Ganancia <b class="${r.profit >= 0 ? 'fair' : 'exp'}">${money(r.profit)}/día</b>`;
  $('#bb-' + id).innerHTML = r.closed ? '<span class="badge r">CERRADA</span>' : b.boostT > 0 ? '<span class="badge gr">EN AUGE</span>' : '';
 }
}
function vBanco(v) {
 const nach = Object.keys(S.ach).length;
 setKey(v, 'banco' + S.log.length + (S.log[0] || '') + nach, () => `<section class="panel"><h2>Dólar blue</h2>
  <div class="note" style="margin-top:0">Los pesos pierden valor con la inflación; los dólares no. Comprá cuando te sobre plata y vendé cuando necesites invertir. Ojo con la diferencia entre compra y venta.</div>
  <div class="kv"><span>Compra / Venta</span><b id="bk-rate"></b></div>
  <div class="kv"><span>Tus dólares</span><b id="bk-usd"></b></div>
  <div class="kv"><span>Valen</span><b id="bk-val"></b></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px">
   <button class="btn g sm" data-act="usdbuy" data-arg="100">Comprar 100</button><button class="btn g sm" data-act="usdbuy" data-arg="1000">Comprar 1000</button><button class="btn g sm" data-act="usdbuy" data-arg="all">Comprar todo</button>
   <button class="btn sm" data-act="usdsell" data-arg="100">Vender 100</button><button class="btn sm" data-act="usdsell" data-arg="1000">Vender 1000</button><button class="btn sm" data-act="usdsell" data-arg="all">Vender todo</button>
  </div></section>
  <section class="panel"><h2>Economía</h2>
  <div class="kv"><span>Inflación mensual</span><b id="bk-inf"></b></div>
  <div class="kv"><span>Inflación acumulada</span><b id="bk-acc"></b></div>
  <div class="kv"><span>Clientes atendidos / perdidos</span><b id="bk-cl"></b></div>
  <div class="kv"><span>Se fueron por caro / salón lleno</span><b id="bk-ex"></b></div>
  <div class="kv"><span>Achilatas / deliveries</span><b id="bk-ad"></b></div>
  <h3>Noticias</h3><div class="log">${S.log.length ? S.log.map(l => `<div>${esc(l)}</div>`).join('') : '<div>Sin novedades todavía.</div>'}</div>
  </section><section class="panel"><h2>Logros <small>${nach}/${ACH.length}</small></h2>
  ${ACH.map(a => `<div class="ach ${S.ach[a.id] ? 'ok' : ''}"><span class="ic"></span><div><b>${a.name}</b><br>${a.desc}${a.rew ? ' · premio ' + money(a.rew * S.I) : ''}</div></div>`).join('')}
  </section><section class="panel"><h2>Opciones</h2>
  <button class="btn big b" data-act="pause">Abrir menú de pausa</button>
  <div class="note">La partida se guarda sola en este navegador. Desde la pausa podés hacer una copia de seguridad.</div></section>`);
 $('#bk-rate').textContent = money(blue() * 1.02) + ' / ' + money(blue() * 0.98);
 $('#bk-usd').textContent = 'US$ ' + nf.format(S.usd);
 $('#bk-val').textContent = money(S.usd * blue() * 0.98);
 $('#bk-inf').textContent = pct(S.inf);
 $('#bk-acc').textContent = '+' + nf.format((S.I - 1) * 100) + '%';
 $('#bk-cl').textContent = nf.format(S.stats.served) + ' / ' + nf.format(S.stats.lost);
 $('#bk-ex').textContent = nf.format(S.stats.expensive) + ' / ' + nf.format(S.stats.full);
 $('#bk-ad').textContent = nf.format(S.stats.achilata) + ' / ' + nf.format(S.stats.delivery);
}
function updateAfford() { document.querySelectorAll('#view [data-cost]').forEach(b => b.classList.toggle('dis', S.money < +b.dataset.cost)); }
function render() {
 if (!S) return;
 renderHUD(); renderBanner(); renderTabs();
 const v = $('#view');
 if (S.phase < 2 && tab === 'cadena') tab = 'cocina';
 ({cocina:vCocina, precios:vPrecios, mejoras:vMejoras, local:vLocal, cadena:vCadena, banco:vBanco}[tab] || vCocina)(v);
 updateAfford();
}

/* ================= INICIO ================= */
function intro() {
 modal(`<div class="title">BURGER<br>TYCOON</div><div class="sub">Edición Tucumán<br>De la esquina al imperio</div>${img('mila', 96)}
 <p>Te quedaste con un localcito en una esquina de San Miguel de Tucumán: una plancha, un mostrador y muchas ganas. Cociná, atendé, decorá, remarcá antes de que la inflación te coma el margen y, si te va bien, armá una cadena en todo el país.</p>
 <label>Nombre de tu sanguchería</label><input id="nm" maxlength="22" value="La Esquina">
 <button class="btn big g" data-act="start">Abrir el local</button>`);
}
S = load();
if (!S) { S = newState(); intro(); }
let last = performance.now(), saveT = 0;
setInterval(() => {
 const now = performance.now(), dt = Math.min((now - last) / 1000, 0.5); last = now;
 if (!S || paused) return;
 for (let i = 0; i < S.speed; i++) tick(dt);
 render();
 saveT += dt; if (saveT > 10) { saveT = 0; save(); }
}, 100);
document.addEventListener('visibilitychange', () => {
 if (!S) return;
 if (document.hidden) { save(); if (!paused) pauseMenu(); }
});
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').then(() => { G3.dirty = true; }).catch(() => {});
requestAnimationFrame(loop3);
render();
</script>
